<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGNITE</title>
  <script>
    // 최신 버전을 받으려고 붙인 ?v=... 를 주소창에서 지워 깔끔한 주소만 보이게
    if (location.search) history.replaceState(null, '', location.pathname);
  </script>
  <!-- 애플 기기(아이맥)는 시스템 폰트 SF Pro를 그대로 쓰고, 그 외(Windows 등)는 SF Pro와 비슷한 Pretendard로 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* Apple HIG 기준
       - 컨트롤은 콘텐츠(카메라) 위에 떠 있는 Liquid Glass 한 겹 (글래스 위에 글래스 겹치지 않기)
       - 글자가 있는 툴바·상태 표시는 regular 변형 (흐림 + 밝기 조정으로 가독성)
       - 캡슐 모양, 누르는 영역 최소 44pt, 강조(tint)는 주요 버튼 하나만
       - 투명도 줄이기 / 대비 높이기 / 동작 줄이기 설정 존중 */
    :root {
      --label: rgba(255, 255, 255, 0.95);
      --label-2: rgba(255, 255, 255, 0.7);
      --fill: rgba(255, 255, 255, 0.12);
      --fill-press: rgba(255, 255, 255, 0.2);
      --tint: #FE3636;               /* 앱 전체 강조색 하나 (틀 네온과 같은 색) */
      --lx: 30%;                     /* 반사광 위치 (포인터를 따라 살짝 움직임) */
      --ly: 0%;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body {
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

    /* Liquid Glass (regular) */
    .glass {
      /* 가운데 정렬은 좌우 여백 auto로 (transform으로 하면 폭이 바뀔 때 좌우로 흔들림) */
      position: fixed; left: 0; right: 0; margin-inline: auto; width: fit-content;
      border-radius: 999px;
      background: rgba(30, 30, 32, 0.32);
      -webkit-backdrop-filter: blur(22px) saturate(180%) brightness(1.04);
      backdrop-filter: blur(22px) saturate(180%) brightness(1.04);
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.5),      /* 위쪽 가장자리 반사 */
        inset 0 -1px 0.5px rgba(255, 255, 255, 0.12),    /* 아래쪽 가장자리 */
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.22),     /* 유리 테두리 */
        0 10px 30px rgba(0, 0, 0, 0.28);                  /* 떠 있는 그림자 */
      transition: opacity 0.6s ease-in-out, transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1), width 0.5s cubic-bezier(0.25, 0.8, 0.3, 1);
    }
    .glass::before {                 /* 표면 반사광 */
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(120% 160% at var(--lx) var(--ly), rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 55%);
      mix-blend-mode: screen;
    }

    #status {
      top: max(16px, env(safe-area-inset-top));
      padding: 12px 22px;
      font-size: 19px; font-weight: 590; letter-spacing: -0.01em;   /* 1~2m 떨어져서도 읽히게 */
      white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
    }

    #ui {
      bottom: max(20px, env(safe-area-inset-bottom));
      display: flex; gap: 4px; align-items: center;
      padding: 6px;
      max-width: calc(100vw - 32px);
    }
    #ui button {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-width: 48px; height: 48px; padding: 0 16px;
      border: 0; border-radius: 999px;
      background: transparent; color: var(--label);
      font: inherit; font-size: 17px; font-weight: 590; letter-spacing: -0.01em;
      cursor: pointer; white-space: nowrap;
      transition: background 0.2s ease, transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
    }
    #ui button:hover { background: var(--fill); }
    #ui button:active { background: var(--fill-press); transform: scale(0.94); }
    #ui button:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
    #ui svg { width: 20px; height: 20px; flex: none; }

    /* 주요 버튼 하나만 색으로 강조 (glass prominent) */
    #ui button.primary {
      background: rgba(254, 54, 54, 0.88); color: #fff;
      box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.55), inset 0 0 0 0.5px rgba(255, 255, 255, 0.25);
      padding: 0 18px;
    }
    #ui button.primary:hover { background: rgba(255, 82, 82, 0.92); }
    #ui button.primary.on { background: rgba(255, 255, 255, 0.92); color: #1c1c1e; }
    /* 준비 전: 흐리게 (아직 누를 수 없음을 보여줌) */
    #ui button:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
    #ui button { transition: background 0.2s ease, opacity 0.6s ease-in-out, transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1); }


    /* 좁은 화면: 아이콘만 */
    @media (max-width: 640px) {
      #ui .txt { display: none; }
      #ui button { padding: 0 12px; }
    }

    body.clean .glass { opacity: 0; pointer-events: none; transform: scale(0.92); }

    /* 스캔 중 안내 문구: Face ID 설정 화면처럼 틀 아래 크고 짧게 (위쪽 작은 캡슐은 숨김) */
    #caption {
      position: fixed; left: 0; right: 0; margin-inline: auto; width: fit-content;
      max-width: calc(100vw - 32px); text-align: center; pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif;
      font-size: 20px; font-weight: 600; letter-spacing: -0.01em;   /* HIG Title 3 크기 */
      color: rgba(255, 255, 255, 0.96); text-shadow: 0 1px 12px rgba(0, 0, 0, 0.35);
      opacity: 0; transition: opacity 0.6s ease-in-out;   /* 나타나고 사라질 땐 위치 이동 없이 밝기만 */
    }
    body.scanning #caption { opacity: 1; }
    body.scanning #status { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { #caption { transition: none; } }
    .t { display: inline-block; }   /* 글자 바뀔 때 밝기 전환용 */

    /* 접근성: 투명도 줄이기 / 대비 높이기 */
    @media (prefers-reduced-transparency: reduce) {
      .glass { background: rgba(30, 30, 32, 0.94); -webkit-backdrop-filter: none; backdrop-filter: none; }
      .glass::before { display: none; }
    }
    @media (prefers-contrast: more) {
      .glass { background: rgba(0, 0, 0, 0.8); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.85); }
    }
    @media (prefers-reduced-motion: reduce) {
      .glass, #ui button { transition: none; }
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="stage"></canvas>
  <div id="status" class="glass" role="status" aria-live="polite">카메라 연결 중</div>
  <div id="caption" aria-hidden="true"></div>
  <div id="ui" class="glass" role="toolbar" aria-label="포토부스">
    <!-- 카메라는 자동으로 내장 카메라를 고름 (선택 목록은 화면에 안 보이게 남겨 둠) -->
    <select id="camSelect" aria-hidden="true" tabindex="-1" hidden></select>
    <button id="btnCapture" class="primary" title="Space" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c2.5 3 5.5 5.5 5.5 10a5.5 5.5 0 0 1-11 0c0-2 .8-3.6 2-5 .3 1.6 1.1 2.6 2 3-.4-3 .3-5.6 1.5-8z"/></svg>
      <span class="txt">불똥이 추가</span>
    </button>
    <!-- 모두 지우기는 진행자용 X 키로만 (방문객이 실수로 누르지 않게 버튼은 없음) -->
  </div>

  <script type="module">
    import { FilesetResolver, InteractiveSegmenter, HandLandmarker }
      from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

    // 휴대폰/가상 카메라로 잡히는 장치 이름 (노트북 카메라만 쓰기 위해 제외)
    const EXCLUDE = /iphone|android|phone|continuity|link|droidcam|iriun|epoccam|virtual|obs|camo/i;

    const MAX_SPRITES = 10;      // 화면에 동시에 뛰어다니는 불똥이 수
    const SPRITE_H = 0.133;      // 뛰어다니는 불똥이 키 (화면 높이 비율, 마리마다 최대 30% 더 큼)
    const GUIDE_H = 0.275;       // 화면에 보이는 불똥이 틀의 키 (화면 높이 비율)
    const GUIDE_COLOR = '#FE3636';               // 불똥이 틀 테두리 색
    // 스캔 장면 (Face ID 등록 화면 참고)
    const SCAN_LINE_W = 2.5;     // 윤곽선 굵기 (px)
    const SCAN_LINE_W_BOLD = 4;  // '대비 높이기' 설정일 때 윤곽선 굵기
    // WebGL이 안 될 때 쓰는 간단한 유리의 테두리
    const GUIDE_STROKE = 3;      // 선 굵기 (px)
    const GUIDE_STROKE_BOLD = 5; // '대비 높이기' 설정일 때 선 굵기
    const NEON_GLOW = [[28, 0.9], [12, 0.9], [4, 1]];   // 빛 퍼짐 [흐림 px, 세기]
    const GLOW_PAD = 60;         // 빛이 퍼질 여백 (px)
    const WORK_W = 200;          // 인식용 축소 해상도 (가로)
    const MARGIN = 0.15;         // 틀 바깥으로 얼마나 더 보고 판단할지 (틀 크기 비율)
    const COVER_OK = 0.72;       // 틀 안이 불똥이로 이만큼 차 있어야 함 (조금 비뚤어져도 인식되게)
    const SPILL_MAX = 0.8;       // 틀 밖으로 삐져나온 부분은 이만큼까지만 (불똥이를 든 손은 괜찮고, 배경·벽이 통째로 잡히는 건 거름)
    const TIP_BAND = 0.3;        // 틀 위쪽 이만큼(높이 비율)을 불꽃 끝 부분으로 봄
    const TIP_COVER_MIN = 0.4;   // 불꽃 끝 부분도 이만큼은 차야 함 (뒤 배경 판·책상처럼 아래만 꽉 차는 건 거름)
    const EDGE_MAX = 0.25;       // 잘라 본 영역 테두리에 닿은 비율이 이보다 크면 배경 (불똥이 든 팔 정도는 괜찮음)
    const HINT_COVER = 0.6;      // 이만큼 채웠는데 넘치면 "멀리" 안내
    const HINT_SMALL = 0.25;     // 이만큼은 채웠는데 부족하면 "가까이" 안내
    const HINT_BG_SPILL = 1.2;   // 넘침이 이보다 크면 배경이 통째로 잡힌 걸로 보고 안내 안 함
    const STABLE_NEEDED = 4;     // 연속으로 이만큼 들어와 있으면 "인식됨"
    const DETECT_INTERVAL_MS = 120; // 불똥이 인식 간격 (길수록 화면이 덜 끊기지만 인식이 조금 느려짐)
    const STAGE_MAX_DPR = 1.25;  // 캔버스 최대 배율 (레티나에서 낮출수록 가벼움, 글자·버튼은 HTML이라 그대로 선명)
    const CAPTURE_DELAY_MS = 500; // 인식된 뒤 실제로 찍기까지 기다리는 시간
    // 스캔 진행은 유리가 아니라 틀 색이 아래→위로 차오르는 걸로 보여줌 (유리는 그대로)
    const SCAN_FROST = 0;        // 스캔 중 유리가 더 흐려지는 정도
    const SCAN_DIM = 0;          // 스캔 중 유리가 더 어두워지는 정도
    const SCAN_REFRACT = 0;      // 스캔 중 가장자리 굴절이 커지는 비율
    const FILL_FEATHER = 14;     // 차오르는 색 경계의 부드러운 폭 (px)
    // 찍히는 순간
    const ENTER_LIFT_S = 0.3;    // 틀 안 불똥이가 떠오르는 시간
    const ENTER_SHRINK_S = 0.5;  // 떠오른 뒤 뛰어다니는 크기로 줄어드는 시간
    const TURN_S = 0.2;          // 방향 바꿀 때 돌아서는 시간
    const SHADOW_ALPHA = 0.32;   // 발밑 그림자 진하기
    const EMBER_SCALE = 0.8;     // 튀는 불꽃 개수 비율 (줄이면 더 차분)
    const EMBER_RATE = 3.5;      // 불똥이 하나가 1초에 머리 위로 피워 올리는 불티 수
    const LAND_SPARKS = 8;       // 착지할 때 튀는 불꽃 수 (EMBER_SCALE 적용 전)
    const FOOT_SPARKS = 2;       // 뛰어다닐 때 발밑에서 한 번에 튀는 불꽃 수
    const FOOT_SPARK_S = 0.09;   // 발밑 불꽃이 튀는 간격 (초)
    const FIREWORK_SPARKS = 56;  // 폭죽 한 번에 큰 링 불꽃 수 (안쪽 링·흩어지는 불꽃은 이 비율로)
    const BURST_EMBERS = 10;     // 터진 뒤 떠오르는 불티 수
    const BURST_BLOOM = 0.22;    // 터질 때 빛이 퍼지는 크기 (화면 긴 변 비율)
    const BURST_SCALE = 1.5;     // 터짐 세기 배율 (빛·불꽃 수·속도·굵기·연기를 한꺼번에 키움)
    const PARTICLE_MAX = 700;    // 화면 전체 불티·불꽃 최대 개수 (아이맥이 무거워지지 않게)
    const THROW_SPEED = 1.2;     // 놓기 직전 평균 손 속도가 1초에 화면 높이의 이만큼보다 빠르면 "던짐" → 화면 밖으로 날아감
    const THROW_STRAIGHT = 0.8;  // 그리고 이만큼 한 방향으로 곧게 움직였을 때만 (흔들며 놀다 놓은 건 던짐 아님)
    const THROW_WINDOW_MS = 100; // 던질 속도를 재는 구간 길이 (이 시간 동안의 평균)
    const THROW_SEARCH_MS = 300; // 손가락 벌리기 전 이 시간 안에서 가장 빨랐던 구간을 찾음
    const LOST_THROW_MS = 100;   // 잡고 있던 손을 이만큼 놓쳤는데 직전에 던지는 중이었으면 바로 던짐
    const THROW_SKIP_MS = 40;    // 손가락을 벌리기 시작한 바로 전후 이 시간은 빼고 잼 (벌릴 때 손이 움찔해서)
    const THROW_SHAKE_MS = 300;  // 흔들다 놓았는지 보는 구간
    const THROW_SHAKE_SPEED = 1.5; // 이 구간에 손이 1초에 화면 높이의 이만큼보다 빨리 오갔으면 흔들다 던진 걸로 봄
    const THROW_BOOST = 1.3;     // 던진 속도에 곱하는 값 (손보다 조금 더 힘차게 날아가게)
    const THROW_GRAVITY = 1400;  // 던진 뒤 떨어지는 힘 (px/초²)
    const SMOKE_PUFFS = 9;       // 불이 꺼질 때 피어오르는 연기 덩어리 수
    const SMOKE_ALPHA = 0.32;    // 연기 진하기
    const POP_S = 0.32;          // 폭죽으로 사라질 때 몸이 사라지는 시간(초)
    const FIZZLE_S = 0.6;        // 불이 꺼지며 사라지는 시간
    const CLEAR_STAGGER_S = 0.06; // 모두 지울 때 하나씩 꺼지는 간격
    const OVERFLOW_STAGGER_S = 0.3; // 10마리 넘을 때 오래된 것부터 폭죽으로 터지는 간격
    // 안내 문구 (HIG: 같은 동작은 같은 말로, 짧게) — 버튼 "불똥이 추가"와 안내 "불똥이를 추가하세요"를 맞춤
    const MSG_LOADING = '준비 중이에요';
    const MSG_IDLE = 'Space를 눌러 불똥이를 추가하세요';
    const MSG_FIT = '불똥이를 틀에 맞춰주세요';
    const MSG_HOLD = '그대로 잠시만요';
    const MSG_FAR = '조금 더 멀리서 맞춰주세요';
    const MSG_NEAR = '조금 더 가까이 와주세요';
    const BTN_ADD = '불똥이 추가';
    const BTN_CANCEL = '취소';
    const CAPTURE_SOUND = true;  // 찍힐 때 작은 "톡" 소리 (눈으로만 알리지 않게, HIG Motion)
    const CAPTURE_SOUND_VOL = 0.12; // 소리 크기 (0~1)
    const AUTO_CLOSE_MS = 15000; // 틀을 띄우고 불똥이가 인식되지 않으면 닫히는 시간
    const TEXT_OUT_MS = 280;     // 문구 바뀔 때 이전 글자가 어두워지는 시간
    const TEXT_IN_MS = 480;      // 새 글자가 밝아지는 시간
    const TEXT_MIN_MS = 1200;    // 한 문구를 최소 이만큼은 보여줌 (문구가 빠르게 왔다 갔다 하지 않게)
    const AUTO_CLOSE_FADE_MS = 1000; // 닫히기 전 윤곽선이 옅어지는 시간
    const TURN_THRESHOLD = 0.2;  // 좌우 속도가 이보다 커야 돌아섬 (작은 흔들림엔 그대로)
    const SPECIAL_FIREWORK = 0.12; // 폭죽 불꽃 하나하나가 하트·별 모양으로 터질 확률 (드물게)
    const HAND_REACT_R = 0.22;   // 손이 이만큼(화면 높이 비율) 가까이 오면 불똥이가 반응
    const HAND_FLEE_BOOST = 1.4; // 겁 많은 불똥이가 손에서 도망칠 때 빨라지는 배율
    const FLEE_MAX_S = 1.8;      // 이만큼(초) 도망치면 지침
    const FLEE_TIRED_S = 2.5;    // 지쳐서 제자리에 멈춰 있는 시간 (이때 잡기 쉬움)
    const IDLE_S = 8;            // 손도 틀도 없이 이만큼(초) 지나면 불똥이들이 쉬기 시작 (졸거나 서로 쳐다봄)
    const LIFT_SCALE = 0.08;     // 떠오를 때 커지는 비율
    const LIFT_RAISE = 0.04;     // 떠오를 때 올라가는 높이 (틀 키 비율)
    const BLINK_MS = 140;        // 셔터처럼 살짝 어두워지는 시간
    const BLINK_DARK = 0.25;     // 그때 어두워지는 정도
    const RELEASE_S = 0.45;      // 찍힌 뒤 유리가 풀리며 사라지는 시간
    // 틀 밖 배경 (WebGL) — 밝기는 그대로 두고 젖빛 유리처럼 흐리게: 또렷한 틀 안에 시선이 모이게
    const GLASS_BEVEL = 0.04;    // 구멍 가장자리 둥근 경사면 폭 (틀 키 비율)
    const GLASS_REFRACT_PX = 0;  // 경사면에서 뒤 화면이 휘는 정도 (0 = 안 휨, 밝은 배경이 틀 밖으로 번지지 않게)
    const GLASS_RIM = 0;         // 틀 가장자리 유리 반사광 (0 = 없음, 흰 윤곽선만)
    const GLASS_BLUR_PX = 34;    // 흐림 반경 (px, 클수록 더 뿌옇게)
    const GLASS_FROST = 0.4;     // 흐림 전 미리 살짝 뭉개는 정도 (흐림을 매끈하게, 줄인 영상 기준)
    const GLASS_FROST_SOLID = 1.4; // '투명도 줄이기' 설정일 때
    const GLASS_RES = 0.5;       // 유리를 계산하는 해상도 (화면 대비, 낮을수록 가벼움 — 흐린 부분이라 티가 거의 안 남)
    const GLASS_SRC_W = 480;     // 유리 흐림에 쓰는 카메라 영상 가로 크기 (작게 줄여서 올림)
    const GLASS_SAT = 1.15;      // 채도 (색이 튀지 않게 거의 그대로)
    const GLASS_TINT_DARK = 0.0; // 어두운 틴트 세기 (0 = 원래 밝기 그대로, 키우면 틀 밖이 어두워짐)
    const GLASS_SHADOW = 0;      // 구멍 안 그림자 (0 = 없음, 틀 안을 깨끗하게)
    const GLASS_MAG = 1.0;       // 유리 뒤 화면 확대 (1 = 확대 없음, 키우면 화면이 커져 보임)
    const GLASS_DIM_MAX = 0.35;  // 밝은 배경일 때 어둡게 하는 막 (HIG 권장 35%)
    // WebGL이 안 될 때 쓰는 간단한 유리
    const GLASS_BLUR = 8;        // 흐림 정도 (px)
    const GLASS_TINT = 0.14;     // 우윳빛 정도 (0~1)
    const GLASS_REFRACT = 1.06;  // 확대돼 보이는 정도

    const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
    const SEG_MODEL = 'https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite';
    const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

    const PINCH_ON = 0.35;       // 엄지-검지 거리가 손 크기의 이 비율보다 가까우면 "집음"
    const PINCH_OFF = 0.6;       // 이보다 멀어지면 "놓음" (중간은 이전 상태 유지 → 덜 끊김)
    const GRAB_RADIUS = 0.6;     // 불똥이 키의 이 비율 안에서 집으면 잡힘
    const MAX_HANDS = 4;         // 동시에 인식하는 손 개수 (손마다 불똥이 하나씩 잡을 수 있음)
    const HAND_LOST_MS = 700;    // 집고 있는 손을 이 시간 동안 놓쳐도 계속 들고 있음 (빠르게 움직일 때 끊김 방지)
    const PINCH_COOLDOWN_MS = 1200; // 틀이 닫힌 뒤 핀치를 쉬는 시간 (피규어 든 손을 내리는 동작 무시)
    const RELEASE_FRAMES = 4;    // 손가락이 연속으로 이만큼 벌어져 있어야 놓음 (흔들림에 잘못 놓치지 않게)
    const HOLD_MATCH = 0.5;      // 집고 있는 손을 다음 프레임에서 찾을 때 허용 거리 (화면 높이 비율)
    const CURSOR_R = 18;         // 핀치 커서 크기 (손가락을 벌렸을 때)
    const CURSOR_R_PRESS = 9;    // 집었을 때 커서 크기

    const video = document.getElementById('video');
    const stage = document.getElementById('stage');
    const ctx = stage.getContext('2d');
    const statusEl = document.getElementById('status');

    // 글자 바꾸기: 위치는 그대로, 이전 글자가 천천히 어두워졌다가 새 글자가 천천히 밝아짐
    // 한 문구는 최소 TEXT_MIN_MS 동안 보여줘서 빠르게 왔다 갔다 하지 않게 ('동작 줄이기'면 바로 바뀜)
    function swapText(el, text) {
      if (el._target === text) return;
      el._target = text;
      let span = el.querySelector(':scope > .t');
      if (!span) {
        const old = el.textContent;
        el.textContent = '';
        span = document.createElement('span');
        span.className = 't';
        span.textContent = old;
        el.appendChild(span);
      }
      if (reduceMotion || !span.textContent || !span.animate) { span.textContent = text; el._shownAt = performance.now(); return; }
      if (el._anim || el._wait) return;   // 바뀌는 중이거나 기다리는 중이면, 끝날 때 가장 최신 글자로
      if (span.textContent === text) return;   // 다시 원래 문구로 돌아왔으면 그대로
      const wait = TEXT_MIN_MS - (performance.now() - (el._shownAt || 0));
      if (wait > 0) {
        el._wait = setTimeout(() => {
          el._wait = null;
          const latest = el._target;
          el._target = null;
          swapText(el, latest);
        }, wait);
        return;
      }
      el._anim = span.animate([{ opacity: 1 }, { opacity: 0 }],
        { duration: TEXT_OUT_MS, easing: 'ease-in-out', fill: 'forwards' });
      el._anim.finished.then(() => {
        // 유리 캡슐은 글자 길이가 바뀌어도 폭이 툭 바뀌지 않고 부드럽게 늘었다 줄어듦
        const glass = el.classList.contains('glass');
        const from = glass ? el.offsetWidth : 0;
        span.textContent = el._target;
        if (glass) {
          const to = el.offsetWidth;
          if (Math.abs(to - from) > 1) {
            el.style.width = from + 'px';
            el.offsetWidth;   // 시작 폭을 먼저 적용
            el.style.width = to + 'px';
            const end = e => { if (e.propertyName === 'width') { el.style.width = ''; el.removeEventListener('transitionend', end); } };
            el.addEventListener('transitionend', end);
          }
        }
        el._anim.cancel();
        el._anim = null;
        el._shownAt = performance.now();
        span.animate([{ opacity: 0 }, { opacity: 1 }], { duration: TEXT_IN_MS, easing: 'ease-in-out' });
        // 바뀌는 동안 또 다른 문구가 왔으면 이어서 반영
        if (el._target !== span.textContent) { const latest = el._target; el._target = null; swapText(el, latest); }
      });
    }
    // 기존 코드의 status.textContent = '...' 를 그대로 쓰면서 바뀔 때마다 자연스럽게 전환
    const status = {
      get textContent() { return statusEl._target ?? statusEl.textContent; },
      set textContent(v) { swapText(statusEl, v); }
    };
    const caption = document.getElementById('caption');
    const camSelect = document.getElementById('camSelect');

    const work = document.createElement('canvas');
    const wctx = work.getContext('2d', { willReadFrequently: true });

    let segmenter = null;        // 화면과 같은 곳에서 돌리는 인식 AI (작업 공간을 못 쓸 때만)
    let segWorker = null;        // 별도 작업 공간에서 돌리는 인식 AI
    let aiReady = false;         // 인식 AI 준비 끝 (그 전엔 불똥이 추가를 막음)
    let hands = null;
    let lastHandTime = -1;
    // 핀치 커서 (화면 좌표). sprite = 지금 집고 있는 불똥이
    // 손마다 핀치 커서 하나 (최대 MAX_HANDS개). sprite = 그 손이 집고 있는 불똥이
    const pinches = Array.from({ length: MAX_HANDS }, () => ({
      visible: false, seen: false, lastT: 0, openCount: 0, down: false, x: 0, y: 0, vx: 0, vy: 0, gap: 1,
      sprite: null, offX: 0, offY: 0, hover: null,
      alpha: 0, r: CURSOR_R, press: 0, accent: 0       // 커서 애니메이션 상태
    }));
    let sprites = [];
    let particles = [];
    let lastActive = 0;          // 마지막으로 손이 보였거나 틀이 떠 있던 시각
    let idleAll = false;         // 한동안 아무도 없음 → 불똥이들이 쉼
    let showUI = true;
    let debug = false;
    let lastInfo = null;         // 디버그용 { mask, cover, spill }
    let inside = false;          // 지금 틀 안에 불똥이가 들어와 있는지
    let stableCount = 0;
    let armed = true;            // 불똥이를 틀에서 뺐다가 다시 넣어야 다음 인식
    let missCount = 0;
    let blink = 0;               // 찍힘 신호 진행 (1 → 0)
    let closeFade = 1;           // 틀 자동 닫기 직전 옅어짐 (1 → 0)
    let glow = 0;                // 유리 가장자리 주황빛 (0~1)
    let scan = 0;                // 스캔 중 유리가 짙어진 정도 (0~1, 서서히 변함)
    let readyAt = 0;             // 인식이 안정된 시각 (0 = 아직)

    // HIG 접근성 설정 존중
    const mqMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const mqTransp = matchMedia('(prefers-reduced-transparency: reduce)');
    const mqContrast = matchMedia('(prefers-contrast: more)');
    let reduceMotion = mqMotion.matches, reduceTransparency = mqTransp.matches, highContrast = mqContrast.matches;
    mqMotion.addEventListener?.('change', e => { reduceMotion = e.matches; });
    mqTransp.addEventListener?.('change', e => { reduceTransparency = e.matches; });
    mqContrast.addEventListener?.('change', e => { highContrast = e.matches; });

    // 빛 방향: 기본은 왼쪽 위, 포인터(마우스)를 따라 살짝 움직임 → 유리 반사광이 반응
    const light = { x: -0.7, y: -0.7 };
    const lightTarget = { x: -0.7, y: -0.7 };
    addEventListener('pointermove', e => {
      const nx = e.clientX / innerWidth - 0.5, ny = e.clientY / innerHeight - 0.5;
      lightTarget.x = -0.7 + nx * 0.8;
      lightTarget.y = -0.7 + ny * 0.8;
      document.documentElement.style.setProperty('--lx', (30 + nx * 40).toFixed(1) + '%');
      document.documentElement.style.setProperty('--ly', (ny * 40).toFixed(1) + '%');
    });

    // 배경 밝기에 따라 어둡게 하는 막 (밝을수록 최대 35%)
    let bgDim = 0;
    let bgLum = 0;               // 카메라 화면 평균 밝기 (0~1)
    const lum = document.createElement('canvas');
    lum.width = 16; lum.height = 9;
    const lumc = lum.getContext('2d', { willReadFrequently: true });
    let lumTick = 0;
    function updateBgDim() {
      if (++lumTick % 15 || !video.videoWidth) return;
      lumc.drawImage(video, 0, 0, 16, 9);
      const d = lumc.getImageData(0, 0, 16, 9).data;
      let s = 0;
      for (let i = 0; i < d.length; i += 4) s += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const avg = s / (d.length / 4) / 255;
      bgLum += (avg - bgLum) * 0.5;
      const target = Math.min(1, Math.max(0, (avg - 0.4) / 0.3)) * GLASS_DIM_MAX;
      bgDim += (target - bgDim) * 0.5;
    }
    let presence = 0;            // 틀이 보이는 정도 (0~1)
    let guideOn = false;         // Space로 틀을 띄웠는지

    // ---------- 불똥이 실루엣 (틀) ----------

    // silhouette = 영상 원본 기준 모양, guideSil = 화면(거울)에 보이는 틀 모양 (좌우반전)
    const silhouette = new Image();
    const guideSil = document.createElement('canvas');
    silhouette.onload = () => {
      guideSil.width = silhouette.width; guideSil.height = silhouette.height;
      const g = guideSil.getContext('2d');
      g.translate(guideSil.width, 0);
      g.scale(-1, 1);
      g.drawImage(silhouette, 0, 0);
    };
    silhouette.src = 'silhouette.png?v=' + Date.now();   // 바꾼 실루엣이 예전 것으로 보이지 않게 항상 새로 받음
    const ASPECT = 0.763;        // 실루엣 가로/세로 비율

    // 화면에 그리는 틀 위치
    function guideBox() {
      const h = innerHeight * GUIDE_H, w = h * ASPECT;
      return { x: (innerWidth - w) / 2, y: innerHeight * 0.46 - h / 2, w, h };
    }

    // 틀(+여유)이 영상 원본(좌우반전 전)의 어느 부분인지
    function guideInVideo(margin) {
      const g = guideBox(), L = videoLayout();
      const mx = g.w * margin, my = g.h * margin;
      const xUnmirrored = innerWidth - (g.x - mx) - (g.w + mx * 2);
      return {
        x: (xUnmirrored - L.ox) / L.s,
        y: (g.y - my - L.oy) / L.s,
        w: (g.w + mx * 2) / L.s,
        h: (g.h + my * 2) / L.s
      };
    }

    // 실루엣 모양 그대로 반투명하게 + 테두리 (색이 바뀌며 진행 상황 표시)
    const guideCache = { key: '', fill: null, ring: null, bold: null, glow: null };
    function guideImages(w, h) {
      const key = Math.round(w) + 'x' + Math.round(h);
      if (guideCache.key === key) return guideCache;
      const make = () => { const c = document.createElement('canvas'); c.width = Math.round(w) + 12; c.height = Math.round(h) + 12; return c; };
      const fill = make(), ring = make();
      const f = fill.getContext('2d');
      f.drawImage(guideSil, 6, 6, w, h);
      // 실루엣 바깥쪽으로 inner~outer px 떨어진 띠 (color 색)
      const band = (canvas, inner, outer, color) => {
        const c = canvas.getContext('2d');
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) c.drawImage(guideSil, 6 + Math.cos(a) * outer, 6 + Math.sin(a) * outer, w, h);
        c.globalCompositeOperation = 'destination-out';
        if (inner > 0) for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) c.drawImage(guideSil, 6 + Math.cos(a) * inner, 6 + Math.sin(a) * inner, w, h);
        else c.drawImage(guideSil, 6, 6, w, h);
        c.globalCompositeOperation = 'source-in';
        c.fillStyle = color;
        c.fillRect(0, 0, canvas.width, canvas.height);
      };
      band(ring, 0, GUIDE_STROKE, GUIDE_COLOR);          // 선 하나 (깔끔하게)
      // 스캔 윤곽선: 구멍과 같은 실루엣에서 바로 따서 가장자리와 정확히 겹침
      const white = make(); band(white, 0, SCAN_LINE_W, '#fff');
      const whiteBold = make(); band(whiteBold, 0, SCAN_LINE_W_BOLD, '#fff');
      const accent = make(); band(accent, 0, SCAN_LINE_W, GUIDE_COLOR);
      const accentBold = make(); band(accentBold, 0, SCAN_LINE_W_BOLD, GUIDE_COLOR);
      const bold = make(); band(bold, 0, GUIDE_STROKE_BOLD, GUIDE_COLOR);   // '대비 높이기'용 두꺼운 선

      // 은은한 빛: 틀 바깥으로만 퍼짐 (틀 안의 불똥이·사람 얼굴은 가리지 않게) — 한 번만 만들어 둠
      const thick = make(); band(thick, 0, 8, GUIDE_COLOR);
      const glow = document.createElement('canvas');
      glow.width = thick.width + GLOW_PAD * 2; glow.height = thick.height + GLOW_PAD * 2;
      const gc = glow.getContext('2d');
      gc.shadowColor = GUIDE_COLOR;
      gc.shadowOffsetX = 10000;
      for (const [blur, a] of NEON_GLOW) {
        gc.globalAlpha = a;
        gc.shadowBlur = blur;
        gc.drawImage(thick, GLOW_PAD - 10000, GLOW_PAD);
      }
      gc.shadowColor = 'transparent';
      gc.globalAlpha = 1;
      gc.globalCompositeOperation = 'destination-out';
      gc.drawImage(guideSil, GLOW_PAD + 6, GLOW_PAD + 6, w, h);
      Object.assign(guideCache, { key, fill, ring, bold, glow, white, whiteBold, accent, accentBold });
      return guideCache;
    }

    // 인식용: work 크기에 맞춘 실루엣 (영상 원본 기준 모양)
    const tplCache = { key: '', g: null, area: 0 };
    function tplGrid(w, h) {
      const key = w + 'x' + h;
      if (tplCache.key === key) return tplCache;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cc = c.getContext('2d', { willReadFrequently: true });
      const mx = w * MARGIN / (1 + MARGIN * 2), my = h * MARGIN / (1 + MARGIN * 2);
      cc.drawImage(silhouette, mx, my, w - mx * 2, h - my * 2);
      const d = cc.getImageData(0, 0, w, h).data;
      const g = new Uint8Array(w * h);
      let area = 0, top = h, bottom = 0;
      for (let i = 0; i < g.length; i++) if (d[i * 4 + 3] > 127) {
        g[i] = 1; area++;
        const y = (i / w) | 0;
        if (y < top) top = y;
        if (y > bottom) bottom = y;
      }
      // 불꽃 끝 부분 (틀 위쪽)
      const tipY = top + (bottom - top) * TIP_BAND;
      const tip = new Uint8Array(w * h);
      let tipArea = 0;
      for (let i = 0; i < g.length; i++) if (g[i] && i < tipY * w) { tip[i] = 1; tipArea++; }
      Object.assign(tplCache, { key, g, area, tip, tipArea });
      return tplCache;
    }

    // ---------- 카메라 ----------

    const CAMERA_ERRORS = {
      NotAllowedError: '카메라 권한이 거부됐어요. 주소창 왼쪽 자물쇠 → 카메라 → 허용 후 새로고침해주세요',
      NotFoundError: '카메라를 찾을 수 없어요',
      NotReadableError: '다른 프로그램(줌, 카메라 앱 등)이 카메라를 쓰고 있어요. 닫고 새로고침해주세요',
      OverconstrainedError: '선택한 카메라를 열 수 없어요'
    };

    async function openCamera(deviceId) {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const v = { width: { ideal: 1920 }, height: { ideal: 1080 } };
      if (deviceId) v.deviceId = { exact: deviceId };
      const stream = await navigator.mediaDevices.getUserMedia({ video: v });
      video.srcObject = stream;
      await video.play();
      return stream.getVideoTracks()[0];
    }

    async function startLaptopCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = '이 브라우저에서는 카메라를 쓸 수 없어요 (https 주소로 열어주세요)';
        return;
      }
      try {
        // 장치 이름을 읽으려면 먼저 권한이 필요함 → 기본 카메라로 먼저 연다
        let track = await openCamera();

        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        let saved = null;
        try { saved = localStorage.getItem('camId'); } catch (e) {}
        const pick = cams.find(d => d.deviceId === saved) || cams.find(d => !EXCLUDE.test(d.label)) || cams[0];

        camSelect.innerHTML = '';
        for (const c of cams) {
          const o = document.createElement('option');
          o.value = c.deviceId;
          o.textContent = c.label || '카메라';
          camSelect.appendChild(o);
        }

        if (pick && pick.deviceId !== track.getSettings().deviceId) {
          try { track = await openCamera(pick.deviceId); }
          catch (e) { track = await openCamera(); }   // 실패하면 기본 카메라 유지
        }
        camSelect.value = track.getSettings().deviceId;
        status.textContent = aiReady ? MSG_IDLE : MSG_LOADING;
      } catch (err) {
        status.textContent = CAMERA_ERRORS[err.name] || ('카메라 오류: ' + err.name + ' ' + err.message);
      }
    }

    camSelect.onchange = async () => {
      try {
        await openCamera(camSelect.value);
        try { localStorage.setItem('camId', camSelect.value); } catch (e) {}
      } catch (err) {
        status.textContent = CAMERA_ERRORS[err.name] || ('카메라 오류: ' + err.name);
      }
    };

    // ---------- AI 모델 ----------

    // 불똥이 인식 AI를 별도 작업 공간(Web Worker)에서 돌림 → AI가 계산하는 동안에도 화면이 멈추지 않음
    async function startSegWorker() {
      const wk = new Worker('seg-worker.js?v=' + Date.now(), { type: 'module' });
      await new Promise((ok, no) => {
        const timer = setTimeout(() => no(new Error('시간 초과')), 30000);
        wk.onmessage = e => {
          if (e.data.type === 'ready') { clearTimeout(timer); ok(); }
          else if (e.data.type === 'error') { clearTimeout(timer); no(new Error(e.data.message)); }
        };
        wk.onerror = e => { clearTimeout(timer); no(new Error(e.message)); };
        wk.postMessage({ type: 'init', wasm: WASM, model: SEG_MODEL });
      });
      const pending = new Map();
      let nextId = 1;
      wk.onmessage = e => {
        const r = pending.get(e.data.id);
        pending.delete(e.data.id);
        if (e.data.message) console.warn('작업 공간 인식 오류', e.data.message);
        if (r) r(e.data.masks || []);
      };
      return {
        segment(bitmap, points) {
          const id = nextId++;
          return new Promise(res => { pending.set(id, res); wk.postMessage({ type: 'segment', id, bitmap, points }, [bitmap]); });
        }
      };
    }

    // 화면 쪽에서 직접 돌리는 인식 AI로 바꾸기 (작업 공간을 못 쓰거나 거기서 계속 실패할 때)
    let workerFails = 0, switching = null;
    function switchToMainSegmenter() {
      if (switching) return switching;
      console.warn('작업 공간 대신 화면에서 직접 인식할게요');
      switching = (async () => {
        const vision = await FilesetResolver.forVisionTasks(WASM);
        const make = (delegate) => InteractiveSegmenter.createFromOptions(vision, {
          baseOptions: { modelAssetPath: SEG_MODEL, delegate },
          outputCategoryMask: true, outputConfidenceMasks: false
        });
        try { segmenter = await make('GPU'); } catch (e2) { segmenter = await make('CPU'); }
        segWorker = null;
      })();
      return switching;
    }

    async function loadModels() {
      const vision = await FilesetResolver.forVisionTasks(WASM);
      try {
        segWorker = await startSegWorker();
      } catch (e) {
        console.warn('작업 공간을 쓸 수 없어요', e);
        await switchToMainSegmenter();
      }

      // 손 인식은 실패해도 사진 인식은 계속 되게 따로
      const makeHands = (delegate) => HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: HAND_MODEL, delegate },
        runningMode: 'VIDEO', numHands: MAX_HANDS,
        // 빠르게 움직여 흐릿해진 손도 계속 따라가게 (기본 0.5 → 0.3)
        minHandPresenceConfidence: 0.3, minTrackingConfidence: 0.3
      });
      try { hands = await makeHands('GPU'); }
      catch (e) {
        try { hands = await makeHands('CPU'); } catch (e2) { console.error('손 인식을 불러오지 못했어요', e2); }
      }
    }

    // ---------- 엄지·검지 핀치로 불똥이 잡기 ----------

    // 영상 좌표(0~1) → 화면 좌표 (좌우반전)
    function toScreen(p) {
      const L = videoLayout();
      return {
        x: innerWidth - (p.x * video.videoWidth * L.s + L.ox),
        y: p.y * video.videoHeight * L.s + L.oy
      };
    }

    function updateHands(now, dt) {
      // 불똥이 스캔 중(틀이 떠 있을 때)엔 손 제스처를 끔: 불똥이를 든 손이 커서로 잡히지 않게
      // (HIG: 한 화면에서 서로 부딪히는 동작을 섞지 않기) — 잡고 있던 불똥이는 놓고, 커서는 부드럽게 사라짐
      // 틀이 닫힌 직후 PINCH_COOLDOWN_MS 동안도 쉼: 불똥이 피규어를 든 손을 내리는 동작이
      // 화면 속 불똥이를 집어 던지는 걸로 잘못 인식되지 않게
      if (guideOn || performance.now() - guideClosedAt < PINCH_COOLDOWN_MS) {
        for (const p of pinches) { if (p.down) pinchEnd(p); p.visible = false; }
        return;
      }
      if (!hands || !video.videoWidth || video.currentTime === lastHandTime) return;
      lastHandTime = video.currentTime;
      let res;
      try { res = hands.detectForVideo(video, now); } catch (e) { return; }

      // 손마다: 엄지·검지 사이 위치, 손 크기(손목~가운데 손가락 뿌리) 대비 두 손가락 거리
      const found = (res.landmarks || []).map(lm => {
        const size = Math.hypot(lm[9].x - lm[0].x, lm[9].y - lm[0].y) || 1;
        const p = toScreen({ x: (lm[4].x + lm[8].x) / 2, y: (lm[4].y + lm[8].y) / 2 });
        return { x: p.x, y: p.y, gap: Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / size };
      });

      // 이번 프레임의 손을 지난 프레임의 같은 손과 짝지음 → 손마다 따로 집기
      // 빠르게 움직이면 한 프레임에 많이 이동하니, 지금 속도로 "있을 법한 자리"와 비교하고 집고 있는 손은 더 넓게 찾음
      const t = performance.now();
      for (const p of pinches) p.seen = false;
      for (const f of found) {
        let best = null, bestD = Infinity;
        for (const p of pinches) {
          if (p.seen || !p.visible) continue;
          const ahead = Math.min(0.15, (t - p.lastT) / 1000);
          const d = Math.hypot(p.x + p.vx * ahead - f.x, p.y + p.vy * ahead - f.y);
          const limit = innerHeight * (p.down ? HOLD_MATCH : 0.25);
          if (d < limit && d < bestD) { best = p; bestD = d; }
        }
        if (!best) best = pinches.find(p => !p.seen && !p.visible);
        if (best) trackHand(best, f, t);
      }
      // 손을 잠깐 놓쳐도 바로 놓지 않음: 집고 있으면 그 속도로 계속 따라가다 HAND_LOST_MS 지나면 놓음
      for (const p of pinches) {
        if (p.seen || !p.visible) continue;
        const lost = t - p.lastT;
        // 세게 휘두르면 영상이 흐려져 손을 놓침 → 놓치기 직전에 빠르게 던지는 중이었으면 바로 던진 걸로
        if (p.down && p.sprite && lost > LOST_THROW_MS && throwKind(throwVelocity(p, true))) {
          p.visible = false;
          pinchEnd(p, true);
          continue;
        }
        if (p.down && lost < HAND_LOST_MS) {
          const step = Math.min(0.05, dt);
          p.x += p.vx * step; p.y += p.vy * step;
          p.vx *= 0.9; p.vy *= 0.9;   // 놓친 동안은 점점 느려지게
        } else if (lost > (p.down ? HAND_LOST_MS : 150)) {
          p.visible = false;
          if (p.down) pinchEnd(p);
        }
      }
    }

    function trackHand(p, f, t) {
      p.seen = true;
      const since = (t - p.lastT) / 1000;
      // 살짝 부드럽게 따라가기 (손 떨림 줄이기), 집고 있을 땐 더 바짝 따라감
      const k = !p.visible ? 1 : p.down ? 0.75 : 0.5;
      const nx = p.x + (f.x - p.x) * k, ny = p.y + (f.y - p.y) * k;
      if (p.visible && since > 0 && since < 0.3) {
        p.vx = p.vx * 0.5 + ((nx - p.x) / since) * 0.5;
        p.vy = p.vy * 0.5 + ((ny - p.y) / since) * 0.5;
      } else if (!p.visible) { p.vx = 0; p.vy = 0; }
      p.x = nx; p.y = ny;
      p.lastT = t;
      p.gap = f.gap;
      // 손가락 거리는 부드럽게 (빠르게 움직여 흐려질 때 한 프레임씩 튀는 값에 흔들리지 않게)
      p.gapS = p.visible && p.gapS != null ? p.gapS * 0.55 + f.gap * 0.45 : f.gap;
      p.visible = true;
      // 던질 속도 계산용: 최근 손 위치 기록 (원본 위치)
      (p.hist || (p.hist = [])).push({ t, x: f.x, y: f.y });
      while (p.hist.length && t - p.hist[0].t > 600) p.hist.shift();
      if (!p.down && f.gap < PINCH_ON) pinchStart(p);
      else if (p.down) {
        // 흔들려서 손가락 거리가 몇 번 튀어도 놓지 않게: 부드럽게 한 값이 연속으로 벌어져 있어야 놓음
        if (p.gapS > PINCH_OFF) {
          if (!p.openCount) p.openStartT = t;   // 손가락을 벌리기 시작한 순간 (던질 속도는 이 직전 기준)
          p.openCount = (p.openCount || 0) + 1;
        } else { p.openCount = 0; p.openStartT = 0; }   // 다시 오므렸으면 벌리기 시작 시각도 지움 (예전 시각으로 속도 재지 않게)
        if (p.openCount >= RELEASE_FRAMES) { p.openCount = 0; pinchEnd(p); }
      }
    }

    // 던질 속도: 손가락을 벌리기 전 THROW_SEARCH_MS 안에서, 곧게 움직인 THROW_WINDOW_MS 구간 중 가장 빨랐던 평균 속도
    //  - 맨 마지막만 재면 손가락을 알아챌 땐 이미 감속 중이라 느리게 나옴 → 가장 빨랐던 구간을 씀
    //  - 순간(한 프레임) 대신 구간 평균: 손 위치가 한 프레임 튀는 건 던짐으로 안 봄
    //  - 벌리기 시작한 직후(THROW_SKIP_MS)는 빼고 잼: 손가락이 벌어지며 잡은 위치가 움찔하는 구간 (손을 놓쳤을 땐 안 뺌)
    //  - straight: 이리저리 흔들면 낮고(0에 가까움), 한 방향으로 휙 던지면 1에 가까움
    function throwVelocity(p, lost) {
      const end = (lost ? p.lastT : (p.openStartT || p.lastT) - THROW_SKIP_MS);
      const pts = (p.hist || []).filter(h => h.t <= end && h.t >= end - THROW_SEARCH_MS);
      let best = { vx: 0, vy: 0, sp: 0, straight: 0 };
      for (let i = 0; i < pts.length; i++) {
        // i에서 시작해 THROW_WINDOW_MS 안에 드는 마지막 점까지
        let j = i;
        while (j + 1 < pts.length && pts[j + 1].t - pts[i].t <= THROW_WINDOW_MS + 5) j++;
        const a = pts[i], b = pts[j], dt = (b.t - a.t) / 1000;
        if (j - i < 2 || dt < 0.05) continue;
        let path = 0;
        for (let k = i + 1; k <= j; k++) path += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
        const net = Math.hypot(b.x - a.x, b.y - a.y), sp = net / dt, straight = path ? net / path : 0;
        // 곧게 움직인 구간을 먼저, 그다음 빠른 구간을
        if ((straight > THROW_STRAIGHT) > (best.straight > THROW_STRAIGHT) ||
            ((straight > THROW_STRAIGHT) === (best.straight > THROW_STRAIGHT) && sp > best.sp)) {
          best = { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt, sp, straight };
        }
      }
      // 흔들기: 좀 더 긴 구간(THROW_SHAKE_MS) 동안 손이 움직인 거리의 속도 + 마지막으로 휘두른 방향
      //  (빠르게 왔다 갔다 하다 놓으면 방향이 바뀌는 순간이라 평균 속도는 0에 가깝지만, 이걸로 던짐을 알아챔)
      const sh = (p.hist || []).filter(h => h.t <= end && h.t >= end - THROW_SHAKE_MS);
      let shakePath = 0, dirX = 0, dirY = 0;
      for (let i = 1; i < sh.length; i++) shakePath += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      for (let i = sh.length - 1; i > 0; i--) {
        const dx = sh[i].x - sh[i - 1].x, dy = sh[i].y - sh[i - 1].y, d = Math.hypot(dx, dy);
        if (d > 4) { dirX = dx / d; dirY = dy / d; break; }
      }
      const shDt = sh.length > 1 ? (sh[sh.length - 1].t - sh[0].t) / 1000 : 0;
      return { ...best, shakeSp: shDt > 0.1 ? shakePath / shDt : 0, dirX, dirY };
    }

    // 놓을 때 어떻게 할지: 'throw' 휙 던짐 / 'shake' 흔들다 던짐 / null 그냥 놓기
    function throwKind(v) {
      if (v.sp > innerHeight * THROW_SPEED && v.straight > THROW_STRAIGHT) return 'throw';
      if (v.shakeSp > innerHeight * THROW_SHAKE_SPEED && (v.dirX || v.dirY)) return 'shake';
      return null;
    }

    // 손가락 사이에서 가장 가까운, 아무도 안 잡은 불똥이
    function grabbable(p) {
      let best = null, bestD = Infinity;
      for (const s of sprites) {
        if (s.holder || s.thrown || s.fadeT != null) continue;   // 이미 잡혔거나, 날아가거나, 꺼지는 중이면 못 잡음
        if (s.age < s.liftTime() + ENTER_SHRINK_S) continue;      // 막 튀어나오는 중이면 못 잡음
        const d = Math.hypot(p.x - s.x, p.y - (s.y - s.h * 0.5));
        if (d < s.h * GRAB_RADIUS && d < bestD) { best = s; bestD = d; }
      }
      return best;
    }

    function pinchStart(p) {
      p.down = true;
      const s = grabbable(p);
      if (!s) return;
      p.sprite = s;
      p.offX = s.x - p.x;
      p.offY = s.y - p.y;
      s.holder = p;
      spark(p.x, p.y, 10);
    }

    function pinchEnd(p, lost) {
      p.down = false;
      const s = p.sprite;
      if (!s) return;
      s.holder = null;
      const v = throwVelocity(p, lost);
      const kind = throwKind(v);
      p.openStartT = 0;
      p.openCount = 0;
      p.hist = [];
      if (kind === 'throw') {
        // 세게 던지면: 그 속도(조금 더 힘껏) 그대로 포물선을 그리며 날아가 화면 밖에서 불이 꺼짐
        s.thrown = true;
        s.tvx = v.vx * THROW_BOOST; s.tvy = v.vy * THROW_BOOST;
        s.spinV = Math.max(-8, Math.min(8, v.vx * 0.004));
      } else if (kind === 'shake') {
        // 빠르게 흔들다 놓으면: 마지막으로 휘두른 방향으로 날아감 (흔든 빠르기만큼, 너무 세지 않게)
        const sp = Math.min(v.shakeSp, innerHeight * 2.2) * THROW_BOOST;
        s.thrown = true;
        s.tvx = v.dirX * sp; s.tvy = v.dirY * sp - innerHeight * 0.3;   // 살짝 위로 띄워 포물선
        s.spinV = Math.max(-8, Math.min(8, s.tvx * 0.004));
      } else if (v.sp > innerHeight * 0.15) {
        // 살짝 던지면: 그 방향으로 달려감
        s.vx = v.vx / v.sp; s.vy = v.vy / v.sp; s.turnIn = 1.5;
      }
      s.fallV = 0;
      p.sprite = null;
    }

    // 손가락이 불똥이 위에 있으면 "잡을 수 있음" 표시 (HIG: 상호작용 가능한 대상에 hover 피드백)
    function updateHover() {
      for (const s of sprites) s.hovered = false;
      for (const p of pinches) {
        p.hover = p.visible && !p.down ? grabbable(p) : null;
        if (p.hover) p.hover.hovered = true;
      }
    }

    // 핀치 커서 (iPad 포인터·visionOS 스타일)
    //  - 평소: 반투명 유리 원 + 얇은 테두리, 위쪽에 반사광
    //  - 손가락을 모을수록 원이 작아짐 → 집기 직전 피드백
    //  - 불똥이 위: 테두리가 강조색으로, 원이 살짝 커짐
    //  - 집으면: 작은 강조색 점으로 꽉 참
    function drawPinchCursors(dt) {
      const k = reduceMotion ? 1 : Math.min(1, dt * 14);
      for (const p of pinches) {
        p.alpha += ((p.visible ? 1 : 0) - p.alpha) * (reduceMotion ? 1 : Math.min(1, dt * 10));
        if (p.alpha < 0.01) continue;
        const close = Math.min(1, Math.max(0, (p.gap - PINCH_ON) / (0.9 - PINCH_ON)));
        let rT = p.down ? CURSOR_R_PRESS : CURSOR_R_PRESS + (CURSOR_R - CURSOR_R_PRESS) * close;
        if (p.hover) rT *= 1.25;
        p.r += (rT - p.r) * k;
        p.press += ((p.down ? 1 : 0) - p.press) * k;
        const accent = p.hover || p.down ? 1 : 0;
        p.accent += (accent - p.accent) * k;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 2;
        // 채움: 반투명 흰색 → 집으면 강조색
        const a = 0.18 + 0.72 * p.press;
        ctx.fillStyle = `rgba(${255 - p.press}, ${Math.round(255 - 201 * p.press)}, ${Math.round(255 - 201 * p.press)}, ${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        // 테두리: 흰색 → 잡을 수 있거나 잡으면 강조색
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = `rgba(${255 - p.accent}, ${Math.round(255 - 201 * p.accent)}, ${Math.round(255 - 201 * p.accent)}, 0.9)`;
        ctx.stroke();
        // 위쪽 반사광 (유리 느낌)
        if (p.r > 6) {
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r - 2.5, Math.PI * 1.15, Math.PI * 1.85);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    // ---------- 틀 안에 불똥이가 있는지 ----------

    // AI가 준 마스크에서, 찍은 점과 이어진 물체 덩어리만 남김 (1 = 물체)
    function componentAt(arr, w, h, px, py) {
      if (!arr) return null;
      const start = Math.min(h - 1, Math.round(py * h)) * w + Math.min(w - 1, Math.round(px * w));
      const fg = arr[start];
      const out = new Uint8Array(w * h);
      for (let i = 0; i < out.length; i++) out[i] = arr[i] === fg ? 1 : 0;
      const comp = new Uint8Array(w * h);
      const q = new Int32Array(w * h);
      let head = 0, tail = 0;
      q[tail++] = start; comp[start] = 1;
      while (head < tail) {
        const i = q[head++], x = i % w;
        if (x > 0 && out[i - 1] && !comp[i - 1]) { comp[i - 1] = 1; q[tail++] = i - 1; }
        if (x < w - 1 && out[i + 1] && !comp[i + 1]) { comp[i + 1] = 1; q[tail++] = i + 1; }
        if (i >= w && out[i - w] && !comp[i - w]) { comp[i - w] = 1; q[tail++] = i - w; }
        if (i < w * h - w && out[i + w] && !comp[i + w]) { comp[i + w] = 1; q[tail++] = i + w; }
      }
      return comp;
    }

    // 잡힌 덩어리가 불똥이 모양인지 점수 매기기
    //  cover: 틀을 채운 비율 / spill: 틀 밖으로 넘친 양 / tip: 불꽃 끝 부분을 채운 비율 / edge: 잘라 본 영역 테두리에 닿은 비율
    //  뒤 배경(판·벽·책상)은 틀 아래쪽을 꽉 채워도 불꽃 끝이 비어 있고 테두리 밖으로 이어져 있어서 거름
    function scoreMask(mask, t, w, h) {
      let inter = 0, outside = 0, tipIn = 0;
      for (let i = 0; i < mask.length; i++) {
        if (!mask[i]) continue;
        if (t.g[i]) { inter++; if (t.tip[i]) tipIn++; } else outside++;
      }
      let edgeIn = 0;
      for (let x = 0; x < w; x++) edgeIn += mask[x] + mask[(h - 1) * w + x];
      for (let y = 1; y < h - 1; y++) edgeIn += mask[y * w] + mask[y * w + w - 1];
      const cover = inter / t.area, spill = outside / t.area;
      const tip = tipIn / t.tipArea, edge = edgeIn / (2 * (w + h) - 4);
      const ok = cover >= COVER_OK && spill <= SPILL_MAX && tip >= TIP_COVER_MIN && edge <= EDGE_MAX;
      return { cover, spill, tip, edge, ok };
    }

    // 틀(+여유) 부분만 잘라서 틀 가운데를 찍어보고, 잘린 물체가 틀을 얼마나 채우는지 계산
    const PROBE_POINTS = [[0.5, 0.55], [0.5, 0.4]];   // 몸통 가운데, 조금 위
    async function checkGuide() {
      const r = guideInVideo(MARGIN);
      const w = WORK_W, h = Math.round(WORK_W * r.h / r.w);
      if (work.width !== w || work.height !== h) { work.width = w; work.height = h; }
      wctx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, w, h);
      // 작업 공간이 있으면 거기서 두 점을 한 번에 계산 (화면은 계속 그려짐), 없으면 여기서 직접
      let raws;
      if (segWorker) {
        raws = await segWorker.segment(await createImageBitmap(work), PROBE_POINTS);
        // 작업 공간에서 계속 결과가 비어 오면(브라우저가 거기서 AI를 못 돌림) 화면 쪽 AI로 바꿈
        if (!raws.some(Boolean)) {
          if (++workerFails >= 3) await switchToMainSegmenter();
          return false;
        }
        workerFails = 0;
      } else {
        raws = PROBE_POINTS.map(([px, py]) => {
          let a = null;
          segmenter.segment(work, { keypoint: { x: px, y: py } }, res => { a = res.categoryMask.getAsUint8Array().slice(); });
          return a;
        });
      }
      const t = tplGrid(w, h);
      let best = null;
      for (let k = 0; k < PROBE_POINTS.length; k++) {
        const [px, py] = PROBE_POINTS[k];
        const mask = componentAt(raws[k], w, h, px, py);
        if (!mask) continue;
        const sc = scoreMask(mask, t, w, h);
        if (!best || (sc.ok && !best.ok) || (sc.ok === best.ok && sc.cover - sc.spill > best.cover - best.spill)) {
          best = { mask, ...sc };
        }
        if (best.ok) break;   // 첫 번째 점으로 인식되면 두 번째는 볼 필요 없음
      }
      lastInfo = best;
      return !!(best && best.ok);
    }

    // 인식이 안 될 때 안내 문구
    //  - 틀을 거의 채웠는데 바깥으로 많이 넘침 → 불똥이가 틀보다 큼 → 조금 멀리
    //  - 틀 안에 있는데 덜 채움 → 불똥이가 틀보다 작음 → 조금 가까이
    //  - 틀 주변이 통째로 잡힘(벽·배경) 또는 아무것도 없음 → 기본 안내
    function distanceHint(info) {
      if (info && info.cover >= HINT_COVER && info.tip >= TIP_COVER_MIN && info.spill > SPILL_MAX && info.spill < HINT_BG_SPILL) return MSG_FAR;
      if (info && info.cover >= HINT_SMALL && info.cover < COVER_OK && info.spill <= SPILL_MAX && info.edge <= EDGE_MAX) return MSG_NEAR;
      return MSG_FIT;
    }

    // Space: 불똥이 추가(틀 띄우기) / 취소 (틀이 떠 있을 때만 인식)
    let lastSeenAt = 0;   // 틀을 띄운 시각 또는 마지막으로 불똥이가 인식된 시각 (자동 닫기 기준)
    let guideClosedAt = -1e9;   // 틀이 마지막으로 닫힌 시각 (닫힌 직후엔 핀치를 잠깐 쉼)
    function setGuide(on) {
      if (guideOn && !on) guideClosedAt = performance.now();
      guideOn = on;
      readyAt = 0;
      lastSeenAt = performance.now();
      armed = true;
      stableCount = 0;
      missCount = 0;
      inside = false;
      lastInfo = null;
      status.textContent = on ? MSG_FIT : MSG_IDLE;
      // 주요 버튼: 틀이 떠 있으면 "닫기"로
      const btn = document.getElementById('btnCapture');
      btn.classList.toggle('on', on);
      swapText(btn.querySelector('.txt'), on ? BTN_CANCEL : BTN_ADD);
    }

    // ---------- 틀 안의 불똥이 → 스프라이트 이미지 ----------

    function cutout() {
      const r = guideInVideo(0);
      const scale = Math.min(1, 500 / r.h);
      const out = document.createElement('canvas');
      out.width = Math.round(r.w * scale); out.height = Math.round(r.h * scale);
      const o = out.getContext('2d');
      o.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, out.width, out.height);
      // 영상 원본 기준 모양으로 오림 (화면 틀을 거울로 뒤집은 모양)
      o.globalCompositeOperation = 'destination-in';
      o.drawImage(silhouette, 0, 0, out.width, out.height);
      return out;
    }

    // ---------- 뛰어다니는 불똥이 ----------

    // 찍힌 불똥이 그림에서 대표 색 2~3개를 뽑음 (폭죽 색으로 씀)
    //  - 색깔이 있는 부분을 색상(hue)별로 모아 가장 많은 색부터
    //  - 흰색·검정·회색 위주면 은빛/흰빛으로
    //  - 폭죽은 빛이라 어두운 색은 밝고 선명하게 올림
    function extractPalette(img) {
      const S = 32, c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(img, 0, 0, S, S);
      const d = g.getImageData(0, 0, S, S).data;
      const bins = Array.from({ length: 12 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
      let gray = 0, total = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 200) continue;
        const r = d[i] / 255, gg = d[i + 1] / 255, b = d[i + 2] / 255;
        const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), l = (mx + mn) / 2, s = mx === mn ? 0 : (mx - mn) / (1 - Math.abs(2 * l - 1));
        total++;
        if (s < 0.25 || l < 0.08 || l > 0.95) { gray++; continue; }
        let h = mx === r ? ((gg - b) / (mx - mn)) % 6 : mx === gg ? (b - r) / (mx - mn) + 2 : (r - gg) / (mx - mn) + 4;
        h = (h * 60 + 360) % 360;
        const bin = bins[Math.floor(h / 30) % 12], w = s;
        bin.w += w; bin.r += d[i] * w; bin.g += d[i + 1] * w; bin.b += d[i + 2] * w;
      }
      // 폭죽용으로 밝고 선명하게: 색상(hue)은 그대로, 채도는 높이고 밝기는 잘 보이는 정도로 맞춤
      //  (카메라로 찍으면 색이 바래 보여서 그대로 쓰면 폭죽이 하얗게 보임)
      const vivid = (r, gg, b) => {
        r /= 255; gg /= 255; b /= 255;
        const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), dd = mx - mn || 1e-6;
        const h = mx === r ? ((gg - b) / dd + 6) % 6 : mx === gg ? (b - r) / dd + 2 : (r - gg) / dd + 4;
        const S = 1, L = 0.58, c = (1 - Math.abs(2 * L - 1)) * S, x = c * (1 - Math.abs(h % 2 - 1)), m = L - c / 2;
        const [r1, g1, b1] = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x] : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x];
        return [r1, g1, b1].map(v => Math.round((v + m) * 255));
      };
      const cols = bins.filter(b => b.w > 0.02 * total).sort((a, b) => b.w - a.w).slice(0, 3)
        .map(b => vivid(b.r / b.w, b.g / b.w, b.b / b.w));
      if (!cols.length || gray > total * 0.75) cols.push([235, 238, 245], [190, 200, 215]);   // 흰·검정 불똥이 → 은빛 폭죽
      return cols.slice(0, 3);
    }

    class Sprite {
      constructor(img, x, y, h0) {
        this.img = img;
        this.palette = extractPalette(img);
        this.h = innerHeight * SPRITE_H * (1 + Math.random() * 0.3);   // 마리마다 크기가 살짝 다르게
        this.w = this.h * img.width / img.height;
        this.h0 = h0 || this.h;
        this.x = x; this.y = y;
        const a = Math.random() * Math.PI * 2;
        this.speed = innerHeight * (0.18 + Math.random() * 0.12);
        this.vx = Math.cos(a); this.vy = Math.sin(a);
        this.hop = Math.random() * Math.PI;
        this.hopRate = 7 + Math.random() * 3;
        this.age = 0;
        this.turnIn = 1 + Math.random() * 2;
        this.holder = null;      // 이 불똥이를 집고 있는 손 (없으면 null)
        this.hovered = false;    // 손가락이 위에 있어서 잡을 수 있는 상태
        this.hover = 0;          // hover 강조 애니메이션 (0~1)
        this.swing = 0;
        this.fallV = 0;
        // 바라보는 방향: 1 = 원래 모습(오른쪽으로 갈 때), -1 = 좌우 반전(왼쪽으로 갈 때)
        this.faceTarget = this.vx < 0 ? -1 : 1;
        this.face = this.faceTarget;
        this.handMood = Math.random() < 0.5 ? -1 : 1;   // 손이 다가오면: -1 도망 / 1 반겨서 다가감 (마리마다 랜덤)
        this.go = 1;             // 걷는 빠르기 배율 (쉬면 0, 도망치면 커짐)
        this.amp = 1;            // 깡충 높이 배율
        this.rest = null;        // 쉬는 중: 'doze' 졸기 / 'look' 옆 불똥이 쳐다보기
        this.restIn = null;      // 쉬기 시작할 때까지 남은 시간 (마리마다 달라서 차례로 쉼)
        this.nod = 0;            // 조는 정도 (0~1, 부드럽게)
        this.wake = 0;           // 깨어날 때 깜짝 뛰기 (1 → 0)
      }

      // 그 자리에서 사라지기 (delay초 뒤 시작)
      //  style 'firework': 자기 색으로 폭죽처럼 팡 터지며 사라짐 / 기본: 불이 조용히 꺼짐
      fizzle(delay = 0, style) {
        if (this.fadeT != null) return;
        this.fadeT = 0;
        this.fadeDelay = delay;
        this.fadeStyle = style;
      }

      update(dt) {
        this.age += dt;
        this.hover += ((this.hovered ? 1 : 0) - this.hover) * (reduceMotion ? 1 : Math.min(1, dt * 12));
        // 꺼지는 중: 잡고 있던 손은 놓고, 불이 작아지며 색이 빠지다 연기를 남기고 사라짐
        if (this.fadeT != null && (this.fadeDelay -= dt) <= 0) {
          if (this.holder) { this.holder.sprite = null; this.holder = null; }
          if (this.fadeStyle === 'firework') {
            // 터지는 순간 폭죽, 몸은 살짝 부풀며 빠르게 사라짐
            if (!this.smoked) { this.smoked = true; firework(this.x, this.y - this.h * 0.5, this.w, this.palette, 0, Math.PI * 2); }
            this.fadeT = Math.min(1, this.fadeT + dt / POP_S);
            if (this.fadeT >= 1) this.gone = true;
            return;
          }
          this.fadeT = Math.min(1, this.fadeT + dt / FIZZLE_S);
          if (!this.smoked && this.fadeT > 0.35) {
            this.smoked = true;
            smoke(this.x, this.y - this.h * 0.5, this.w, 0, 0, 5);
          }
          if (this.fadeT >= 1) this.gone = true;
          return;
        }
        // 머리 위 불꽃 끝에서 불티가 피어오름 (등장 연출이 끝난 뒤부터, 들고 있을 때도, 날아갈 땐 꼬리처럼 더 많이)
        if (this.age > this.liftTime() + ENTER_SHRINK_S) {
          this.emberT = (this.emberT ?? Math.random() / EMBER_RATE) - dt;
          if (this.emberT <= 0) {
            this.emberT = (0.5 + Math.random()) / (EMBER_RATE * (this.thrown ? 4 : 1));
            const scale = this.held ? 1.1 : 1;
            // 불똥이 자기 색 불티
            ember(this.x + (Math.random() - 0.5) * this.w * 0.12, this.y - (this.lastLift || 0) - this.h * 0.93 * scale, pickColor(this.palette));
          }
        }
        if (this.thrown) {
          // 던져진 뒤: 포물선 + 회전, 화면을 완전히 벗어나면 불이 꺼지며 연기
          this.x += this.tvx * dt;
          this.y += this.tvy * dt;
          this.tvy += THROW_GRAVITY * dt;
          this.spin = (this.spin || 0) + this.spinV * dt;
          const out = this.x + this.w / 2 < 0 || this.x - this.w / 2 > innerWidth || this.y < 0 || this.y - this.h > innerHeight;
          if (out) extinguish(this);
          return;
        }
        if (this.held) {
          // 집혀 있는 동안: 손을 따라가며 대롱대롱
          const h = this.holder;
          const tx = h.x + h.offX, ty = h.y + h.offY;
          this.swing = (this.swing || 0) * 0.85 + (tx - this.x) * 0.004;
          this.x = tx; this.y = ty;
          // 돌아서던 중이나 졸던 중에 잡혀도 납작하게 멈춰 있지 않게: 마저 돌아서고, 깨어나고, 쉬던 건 풀림
          const ease = reduceMotion ? 1 : Math.min(1, dt * 10);
          const face = Math.sign(this.face || 1);
          this.face += (face - this.face) * ease; this.faceTarget = face;
          this.nod += (0 - this.nod) * ease;
          this.amp += (1 - this.amp) * ease;
          this.rest = null; this.restIn = null;
          return;
        }
        // 손 반응: 가까이 온 손 쪽으로 다가가거나(반가워함) 반대로 도망 (잡을 수 있는 위치면 천천히 → 잡기 쉽게)
        const settled = this.age >= this.liftTime() + ENTER_SHRINK_S;
        let goT = 1, handNear = null, best = HAND_REACT_R * innerHeight;
        const cy = this.y - this.h * 0.5;
        if (settled) for (const p of pinches) {
          if (!p.visible || p.sprite) continue;
          const d = Math.hypot(p.x - this.x, p.y - cy);
          if (d < best) { best = d; handNear = p; }
        }
        // 깡충 박자는 늘 제 속도 (느려지면 슬로모션처럼 보여서) — 멈출 땐 제자리에서 뛰고, 신나면 박자만 살짝 빨라짐
        let hopT = 1;
        this.fleeT = Math.max(0, (this.fleeT || 0) - (handNear ? 0 : dt * 0.5));   // 손이 멀어지면 기운이 천천히 돌아옴
        this.tiredT = Math.max(0, (this.tiredT || 0) - dt);
        if (handNear) {
          const dx = handNear.x - this.x, dy = handNear.y - cy, d = Math.hypot(dx, dy) || 1;
          let ux = dx / d, uy = dy / d;
          if (this.handMood < 0 && this.tiredT > 0) {
            // 겁쟁이가 지침: 그 자리에서 숨 고르듯 콩콩 (이때 잡기 쉬움)
            ux = this.vx; uy = this.vy;
            goT = 0; hopT = 1.1;
          } else if (this.handMood < 0) {
            // 겁쟁이: 반대로 달아남 (조금만 빨리). 커서가 바로 위에 오면 얼어붙은 듯 제자리 콩콩 (그때 잡을 수 있음)
            //  FLEE_MAX_S 넘게 도망치면 지쳐서 FLEE_TIRED_S 동안 멈춤
            ux = -ux; uy = -uy;
            goT = this.hovered ? 0 : HAND_FLEE_BOOST; hopT = 1.35;
            this.fleeT += dt;
            if (this.fleeT >= FLEE_MAX_S) { this.fleeT = 0; this.tiredT = FLEE_TIRED_S; }
          } else {
            // 반가움: 손 쪽으로 가서 바로 앞에선 제자리에서 신나게 콩콩
            goT = d < this.w ? 0 : 1.3; hopT = 1.2;
          }
          // 방향을 휙 꺾지 않고 몸을 돌리듯 부드럽게 틂
          const k = reduceMotion ? 1 : Math.min(1, dt * (this.handMood < 0 ? 3 : 6));   // 도망칠 땐 굼뜨게 틂 (쫓아가면 잡힘)
          const nx = this.vx + (ux - this.vx) * k, ny = this.vy + (uy - this.vy) * k, n = Math.hypot(nx, ny) || 1;
          this.vx = nx / n; this.vy = ny / n;
          this.turnIn = Math.max(this.turnIn, 0.4);
        }
        // 한동안 아무도 없으면 차례로 쉼 (졸거나 옆 불똥이 쳐다보기) → 손이나 틀이 나타나면 깜짝 깨어남
        if (idleAll && !handNear && settled) {
          if (!this.rest) {
            this.restIn = (this.restIn ?? Math.random() * 4) - dt;
            if (this.restIn <= 0) this.rest = Math.random() < 0.5 ? 'doze' : 'look';
          }
        } else {
          if (this.rest) this.wake = 1 + Math.random() * 0.4;   // 1 넘는 만큼은 기다렸다 (한꺼번에 말고 차례로)
          this.rest = null; this.restIn = null;
        }
        if (this.rest === 'look') {
          // 가장 가까운 불똥이 쪽을 바라봄 (혼자면 그냥 졸기)
          let near = null, nd = Infinity;
          for (const o of sprites) {
            if (o === this || o.thrown || o.fadeT != null) continue;
            const d = Math.abs(o.x - this.x) + Math.abs(o.y - this.y);
            if (d < nd) { nd = d; near = o; }
          }
          if (near) this.faceTarget = near.x < this.x ? -1 : 1;
          else this.rest = 'doze';
        }
        if (this.rest) goT = 0;
        const ease = reduceMotion ? 1 : Math.min(1, dt * (goT > this.go ? 4 : 2.5));
        this.go += (goT - this.go) * ease;
        this.hopBoost = (this.hopBoost ?? 1) + (hopT - (this.hopBoost ?? 1)) * ease;
        const ampT = this.rest === 'doze' ? 0 : this.rest === 'look' ? 0.25 : 1;
        this.amp += (ampT - this.amp) * ease;
        this.nod += ((this.rest === 'doze' ? 1 : 0) - this.nod) * (reduceMotion ? 1 : Math.min(1, dt * 1.5));
        if (this.wake > 0) this.wake = Math.max(0, this.wake - dt / 0.45);

        this.turnIn -= dt;
        if (this.turnIn <= 0) {
          // 가끔 방향을 바꿔서 이리저리 돌아다니게
          const a = Math.atan2(this.vy, this.vx) + (Math.random() - 0.5) * 2.4;
          this.vx = Math.cos(a); this.vy = Math.sin(a);
          this.turnIn = 1 + Math.random() * 2.5;
        }
        // 등장(떠오름 → 줄어듦) 동안은 제자리, 다 떠오르면 불꽃이 톡 터짐
        const lifted = this.age >= this.liftTime();
        if (lifted && !this.burst) { this.burst = true; spark(this.x, this.y - this.h0 * 0.5, 24); }
        if (this.age < this.liftTime() + (reduceMotion ? 0 : ENTER_SHRINK_S)) return;
        const go = this.go;
        this.x += this.vx * this.speed * dt * go;
        this.y += this.vy * this.speed * dt * go * 0.6;

        const mx = this.w / 2, top = innerHeight * 0.25, bottom = innerHeight - 20;
        if (this.x < mx) { this.x = mx; this.vx = Math.abs(this.vx); }
        if (this.x > innerWidth - mx) { this.x = innerWidth - mx; this.vx = -Math.abs(this.vx); }
        if (this.y < top) {
          // 높은 곳에서 놓으면 바닥 쪽으로 떨어짐
          this.fallV = (this.fallV || 0) + 2500 * dt;
          this.y = Math.min(top, this.y + this.fallV * dt);
          if (this.y >= top) { this.fallV = 0; this.vy = Math.abs(this.vy); puff(this.x, this.y, this.w * 1.4); }
        }
        if (this.y > bottom) { this.y = bottom; this.vy = -Math.abs(this.vy); }
        this.swing = (this.swing || 0) * 0.9;

        // 가는 방향이 확실히 바뀌었을 때만 돌아섬 (위아래로만 갈 땐 그대로 → 덜 깜빡임)
        if (this.rest) { /* 쉬는 중엔 방향 그대로 (쳐다보기는 위에서 정함) */ }
        else if (this.vx > TURN_THRESHOLD) this.faceTarget = 1;
        else if (this.vx < -TURN_THRESHOLD) this.faceTarget = -1;
        // 휙 뒤집지 않고 몸을 돌리듯 짧게 (HIG: 갑작스러운 변화 대신 자연스러운 전환, '동작 줄이기'면 바로)
        this.face = reduceMotion ? this.faceTarget : this.face + (this.faceTarget - this.face) * Math.min(1, dt / TURN_S * 3);

        const prev = Math.sin(this.hop);
        // 깡충 박자: 쳐다볼 땐 살랑살랑 느리게, 손 근처에선 살짝 빠르게 (걷는 속도와는 따로)
        this.hop += this.hopRate * dt * (this.rest === 'look' ? 0.5 : this.hopBoost);
        // 착지할 때마다 불똥 튀기기 (제자리에서 뛸 때도)
        if (this.amp > 0.5 && prev > 0 && Math.sin(this.hop) <= 0) { puff(this.x, this.y, this.w); spark(this.x, this.y - 4, LAND_SPARKS); }
        // 발이 바닥 가까이 있을 때 달리는 방향 반대쪽으로 작은 불꽃이 바닥을 스침
        this.footT = (this.footT ?? 0) - dt;
        if (go > 0.5 && Math.abs(Math.sin(this.hop)) < 0.35 && this.footT <= 0) {
          this.footT = FOOT_SPARK_S * (0.6 + Math.random() * 0.8);
          footSpark(this.x + (Math.random() - 0.5) * this.w * 0.4, this.y, Math.sign(this.vx) || 1);
        }
      }

      get held() { return !!this.holder; }

      // 발밑 그림자: 가장자리가 부드럽게 흐려지고, 높이 뛸수록 작고 옅어짐 (집혀 있을 땐 없음)
      // 모든 불똥이 몸보다 먼저 그려서 다른 불똥이 머리 위에 그림자가 얹히지 않게
      drawShadow() {
        if (this.held || this.thrown) return;
        const s = Math.abs(Math.sin(this.hop));
        const air = this.age < this.liftTime() + ENTER_SHRINK_S ? 0 : s * this.amp;
        const fade = this.fadeT != null && this.fadeDelay <= 0 ? 1 - this.fadeT : 1;   // 꺼질 때 그림자도 같이 옅어짐
        softEllipse(this.x, this.y, this.w * 0.42 * (1 - air * 0.3), this.h * 0.07 * (1 - air * 0.3), SHADOW_ALPHA * (1 - air * 0.5) * fade);
      }

      liftTime() { return reduceMotion ? 0 : ENTER_LIFT_S; }

      draw() {
        // 등장: ① 틀 안에서 살짝 커지며 떠오름(그림자가 짙어짐) ② 뛰어다니는 크기로 줄어들며 내려앉음
        const LT = this.liftTime(), ST = reduceMotion ? 0 : ENTER_SHRINK_S;
        const full = this.h0 / this.h, peak = full * (1 + LIFT_SCALE);
        let size = 1, raise = 0, depth = 0;
        const entering = this.age < LT + ST;
        if (this.age < LT) {
          const e = 1 - Math.pow(1 - this.age / LT, 3);
          size = full + (peak - full) * e; raise = this.h0 * LIFT_RAISE * e; depth = e;
        } else if (this.age < LT + ST) {
          const e = 1 - Math.pow(1 - (this.age - LT) / ST, 3);
          size = peak + (1 - peak) * e; raise = this.h0 * LIFT_RAISE * (1 - e); depth = 1 - e;
        }

        const s = this.held || entering ? 0 : Math.abs(Math.sin(this.hop)) * this.amp;
        // 깨어날 때 깜짝 한 번 뜀
        const startle = reduceMotion ? 0 : Math.sin((1 - Math.min(1, this.wake)) * Math.PI) * this.h * 0.22;
        const lift = s * this.h * 0.18 + raise + startle;
        this.lastLift = lift;   // 불티가 지금 머리 위치에서 나오도록 기억
        // 졸 땐 숨 쉬듯 천천히 부풀었다 줄어듦
        const breathe = reduceMotion ? 0 : Math.sin(this.age * 2.2) * 0.03 * this.nod;
        // 들고 있을 땐 모양 그대로 (대롱대롱은 기울기로만)
        const squash = this.held ? 1 : (1 + (entering ? 0 : (1 - s) * 0.08 * this.amp)) * (1 - breathe);

        // 불똥이는 정면을 보고 있으니 좌우 반전 대신 가는 방향으로 살짝 기울임
        // 잡을 수 있을 때 살짝 들리고(hover), 집으면 더 커짐 — visionOS의 들어 올림 느낌
        // 꺼지는 중: 작아지고(동작 줄이기면 그대로) 투명해지며 색이 빠짐
        const fading = this.fadeT != null && this.fadeDelay <= 0 ? this.fadeT : 0;
        const pop = this.fadeStyle === 'firework';
        const fadeScale = reduceMotion ? 1 : pop ? 1 + 0.18 * Math.sin(Math.min(1, fading * 1.4) * Math.PI / 2) : 1 - 0.3 * fading * fading;
        const grabbed = (this.held ? 1.1 : 1 + 0.05 * this.hover) * fadeScale;
        // 졸 땐 고개를 한쪽으로 꾸벅
        const doze = this.nod * (0.16 + (reduceMotion ? 0 : Math.sin(this.age * 1.1) * 0.05)) * Math.sign(this.face || 1);
        const tilt = this.held ? -(this.swing || 0) : (this.vx * 0.12 + Math.sin(this.hop * 2) * 0.05) * Math.min(1, this.go) - (this.swing || 0) + doze;
        ctx.save();
        ctx.translate(this.x, this.y - lift);
        if (this.thrown) {
          // 날아가는 동안 몸 가운데를 축으로 빙글
          ctx.translate(0, -this.h / 2);
          ctx.rotate(this.spin || 0);
          ctx.translate(0, this.h / 2);
        } else {
          ctx.rotate(Math.max(-0.6, Math.min(0.6, tilt)));
        }
        // 돌아서는 중간엔 너무 납작해지지 않게 최소 폭을 둠
        const faceX = Math.sign(this.face || 1) * Math.max(0.12, Math.abs(this.face));
        ctx.scale(size * squash * grabbed * faceX, size / squash * grabbed);
        // 떠오른 만큼 아래로 부드러운 그림자 (등장할 때, 잡을 수 있을 때, 집혀 있을 때)
        const lifted = Math.max(depth, this.held ? 1 : this.hover * 0.6);
        if (lifted > 0.01) {
          ctx.shadowColor = `rgba(0, 0, 0, ${0.45 * lifted})`;
          ctx.shadowBlur = 30 * lifted;
          ctx.shadowOffsetY = 14 * lifted;
        }
        if (fading > 0) {
          ctx.globalAlpha = 1 - Math.pow(fading, 1.6);
          ctx.filter = pop ? `brightness(${1 + 0.8 * fading})` : `grayscale(${fading}) brightness(${1 - 0.35 * fading})`;
        }
        ctx.drawImage(this.img, -this.w / 2, -this.h, this.w, this.h);
        ctx.restore();
        if (this.nod > 0.05 && !fading) this.drawZzz(lift);
      }

      // 조는 중: 머리 위로 z가 작게 → 크게 떠오르며 옅어짐 (동작 줄이기면 멈춘 채로)
      drawZzz(lift) {
        const dir = Math.sign(this.face || 1), fs = Math.max(12, this.h * 0.16);
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 6;
        for (let i = 0; i < 3; i++) {
          const ph = reduceMotion ? (i + 0.5) / 3 : (this.age * 0.45 + i / 3) % 1;
          ctx.globalAlpha = Math.sin(ph * Math.PI) * this.nod * 0.9;
          ctx.font = `600 ${Math.round(fs * (0.6 + ph * 0.6))}px -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Pretendard Variable", sans-serif`;
          ctx.fillText('z', this.x + dir * this.w * (0.25 + ph * 0.35), this.y - lift - this.h * (0.95 + ph * 0.45));
        }
        ctx.restore();
      }
    }

    // ---------- 가볍게 그리기용 미리 만든 그림 ----------
    // 그림자·연기·불꽃 빛을 매 프레임 계산하지 않고, 한 번 그려둔 그림을 늘리고 옅게 해서 씀 (모양은 같고 훨씬 가벼움)
    function radialSprite(size, stops) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      for (const [o, col] of stops) gr.addColorStop(o, col);
      g.fillStyle = gr;
      g.fillRect(0, 0, size, size);
      return c;
    }
    const SHADOW_SPRITE = radialSprite(128, [[0, 'rgba(0,0,0,1)'], [0.45, 'rgba(0,0,0,0.7)'], [1, 'rgba(0,0,0,0)']]);
    const SMOKE_SPRITE = radialSprite(128, [[0, 'rgba(200,200,205,1)'], [0.5, 'rgba(170,170,178,0.6)'], [1, 'rgba(160,160,168,0)']]);
    const GLOW_STEPS = 12;   // 불꽃 빛 색을 12단계로 미리 (막 튄 하양-노랑 → 식은 빨강)
    let glowSprites = null;
    // 불똥이 색 폭죽용: 색마다 빛 그림을 한 번만 만들어 둠
    const colorGlows = new Map();
    function colorGlowSprite(col) {
      const key = col.join();
      if (!colorGlows.has(key)) {
        const [r, g, b] = col;
        colorGlows.set(key, radialSprite(32, [[0, `rgba(${r},${g},${b},1)`], [0.35, `rgba(${r},${g},${b},0.45)`], [1, `rgba(${r},${g},${b},0)`]]));
      }
      return colorGlows.get(key);
    }
    // 폭죽 불꽃 색: 막 터질 땐 하얗게 → 금방 불똥이 색으로
    // 하트·별 불꽃 그림 (색마다 한 번만 그려 두고 재사용 → 가벼움)
    const glyphs = new Map();
    function glyphSprite(kind, col) {
      const key = kind + col.join();
      if (glyphs.has(key)) return glyphs.get(key);
      const S = 48, c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      g.translate(S / 2, S / 2);
      g.beginPath();
      if (kind === 'heart') {
        g.moveTo(0, 15);
        g.bezierCurveTo(-26, -2, -14, -24, 0, -10);
        g.bezierCurveTo(14, -24, 26, -2, 0, 15);
      } else {
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 9 : 21;
          g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        g.closePath();
      }
      // 제 색으로 채우고 가운데는 살짝 밝게 (빛나는 느낌)
      const [r, gg, b] = col;
      const grad = g.createRadialGradient(-3, -4, 0, 0, 0, 22);
      grad.addColorStop(0, `rgb(${Math.min(255, r + 90)}, ${Math.min(255, gg + 90)}, ${Math.min(255, b + 90)})`);
      grad.addColorStop(0.55, `rgb(${r}, ${gg}, ${b})`);
      g.fillStyle = grad;
      g.fill();
      glyphs.set(key, c);
      return c;
    }
    function particleColor(p, t, a) {
      if (!p.col) return fireColor(t, a);
      const k = Math.min(1, (1 - t) * 8), [r, g, b] = p.col;   // 터지는 순간만 하얗고 바로 자기 색
      return `rgba(${Math.round(255 + (r - 255) * k)}, ${Math.round(255 + (g - 255) * k)}, ${Math.round(255 + (b - 255) * k)}, ${a})`;
    }

    function glowSprite(t) {
      if (!glowSprites) {
        glowSprites = [];
        for (let i = 0; i < GLOW_STEPS; i++) {
          const col = fireColor((i / (GLOW_STEPS - 1)) * 0.6, 1);
          glowSprites.push(radialSprite(32, [[0, col], [0.35, col.replace(', 1)', ', 0.45)')], [1, col.replace(', 1)', ', 0)')]]));
        }
      }
      return glowSprites[Math.max(0, Math.min(GLOW_STEPS - 1, Math.round(t * (GLOW_STEPS - 1))))];
    }

    // 가장자리가 부드럽게 흐려지는 타원 (그림자·먼지)
    function softEllipse(x, y, rx, ry, alpha) {
      if (alpha <= 0.005 || rx < 1) return;
      const a = ctx.globalAlpha;
      ctx.globalAlpha = a * Math.min(1, alpha);
      ctx.drawImage(SHADOW_SPRITE, x - rx, y - ry, rx * 2, ry * 2);
      ctx.globalAlpha = a;
    }

    // 착지: 발밑에서 먼지가 살짝 퍼졌다 사라짐 (머리 위로 튀는 것 없이)
    function puff(x, y, w) {
      if (reduceMotion) return;
      particles.push({ kind: 'puff', x, y, w, life: 1 });
    }

    // 불티: 불꽃 끝에서 천천히 떠오르며 흔들리다 꺼짐 (하양-노랑 → 주황 → 빨강)
    function ember(x, y, col) {
      if (reduceMotion || particles.length > PARTICLE_MAX) return;
      particles.push({
        kind: 'ember', x, y, vx: (Math.random() - 0.5) * 30, vy: -(50 + Math.random() * 60),
        life: 1, dur: 0.9 + Math.random() * 0.6, r: 1.8 + Math.random() * 1.8, wob: Math.random() * 6.28, col
      });
    }
    const pickColor = pal => pal && pal.length ? pal[Math.floor(Math.random() * pal.length)] : undefined;

    // 불꽃 튐: 짧은 빛줄기가 사방으로 탁 튀고 중력에 떨어지며 꺼짐 (착지, 튀어나올 때, 집을 때)
    function spark(x, y, count, o = {}) {
      if (reduceMotion) return;
      const n = Math.round(count * EMBER_SCALE);
      const center = o.angle ?? -Math.PI / 2, spread = o.spread ?? 2.6;
      const vMin = o.vMin ?? 120, vMax = o.vMax ?? 300;
      for (let i = 0; i < n && particles.length < PARTICLE_MAX; i++) {
        // ring: 폭죽처럼 고르게 퍼짐 / 아니면 무작위 방향
        const a = o.ring ? center + ((i + Math.random() * 0.4) / n - 0.5) * spread : center + (Math.random() - 0.5) * spread;
        const v = vMin + Math.random() * (vMax - vMin);
        particles.push({
          kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1,
          dur: (o.dur ?? 0.35) + Math.random() * 0.25, lw: o.lw ?? 1.6, col: o.col || pickColor(o.palette),
          drag: o.drag, grav: o.grav, trail: o.trail, delay: o.delay,
          glyph: o.glyph, rot: o.glyph ? (Math.random() - 0.5) * 0.6 : 0, vr: (Math.random() - 0.5) * 6
        });
      }
    }

    // 불똥이 색 폭죽: 가운데 빛 → 고르게 퍼지는 큰 불꽃 링 → 작은 불꽃 → 반짝이며 떨어지는 불티 → 옅은 연기
    //  spread = 2π 면 사방(제자리에서 터질 때), 작으면 그 방향으로(화면 가장자리에서 터질 때)
    function firework(x, y, w, palette, angle, spread, ix = 0, iy = 0) {
      if (reduceMotion) return;
      const k = BURST_SCALE;
      // 드물게 불꽃 하나하나가 하트 또는 별 모양
      const glyph = Math.random() < SPECIAL_FIREWORK ? (Math.random() < 0.5 ? 'heart' : 'star') : undefined;
      particles.push({ kind: 'bloom', x, y, r: Math.max(innerWidth, innerHeight) * BURST_BLOOM * k, life: 1, dur: 0.55 + 0.15 * (k - 1), col: palette[0] });
      const shell = { angle, spread, ring: true, drag: 2.2, grav: 180, trail: 0.07, palette, glyph };
      // 큰 링 → 조금 늦게 안쪽 링(다른 색) → 사이사이 흩어지는 불꽃 → 마지막에 작게 타닥타닥
      spark(x, y, FIREWORK_SPARKS * k, { ...shell, vMin: 640 * k, vMax: 760 * k, dur: 1.0, lw: 2.6 * k });
      spark(x, y, FIREWORK_SPARKS * 0.6 * k, { ...shell, col: palette[1 % palette.length], vMin: 330 * k, vMax: 420 * k, dur: 0.9, lw: 2.2 * k, delay: 0.1 });
      spark(x, y, FIREWORK_SPARKS * 0.5 * k, { angle, spread, drag: 2, grav: 260, trail: 0.05, palette, glyph, vMin: 120 * k, vMax: 560 * k, dur: 0.9, lw: 1.6 * k });
      spark(x, y, FIREWORK_SPARKS * 0.4 * k, { angle, spread, drag: 3, grav: 120, trail: 0.02, palette, vMin: 250 * k, vMax: 650 * k, dur: 0.5, lw: 1.2 * k, delay: 0.35 });
      for (let i = 0; i < BURST_EMBERS * k; i++) {
        const a = angle + (Math.random() - 0.5) * spread, r = w * (0.3 + Math.random() * 0.9) * k;
        ember(x + Math.cos(a) * r, y + Math.sin(a) * r, pickColor(palette));
      }
      smoke(x, y, w * 1.2 * k, ix, iy, Math.round(SMOKE_PUFFS * k));
    }

    // 뛰어다닐 때 발밑: 가는 방향 반대쪽으로 작은 불꽃이 바닥을 스치듯 낮게 튐
    function footSpark(x, y, dir) {
      spark(x - dir * 6, y - 2, FOOT_SPARKS, {
        angle: dir > 0 ? Math.PI + 0.35 : -0.35, spread: 0.7,
        vMin: 90, vMax: 230, dur: 0.22, lw: 1.2
      });
    }

    // 던져서 화면 가장자리에서 터질 때: 화면 안쪽으로 부채꼴 폭죽 (불똥이 색)
    function burst(x, y, ix, iy, w, palette) {
      const inward = Math.atan2(iy || -0.3, ix || 0);
      firework(x, y, w, palette, inward, Math.PI * 1.6, ix, iy);
    }

    function updateParticles(dt) {
      for (const p of particles) {
        if (p.kind === 'puff') { p.life -= dt / 0.45; continue; }
        if (p.kind === 'bloom') { p.life -= dt / p.dur; continue; }
        if (p.kind === 'smoke') {
          if (p.delay > 0) { p.delay -= dt; continue; }
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= 1 - dt * 0.8; p.vy = p.vy * (1 - dt * 0.5) - 12 * dt;   // 점점 느려지며 위로
          p.life -= dt / p.dur;
          continue;
        }
        if (p.delay > 0) { p.delay -= dt; continue; }
        if (p.kind === 'ember') {
          p.wob += dt * 5;
          p.x += (p.vx + Math.sin(p.wob) * 18) * dt;   // 아지랑이처럼 좌우로 흔들
          p.y += p.vy * dt;
          p.vy *= 1 - dt * 0.6;
        } else {
          p.x += p.vx * dt; p.y += p.vy * dt;
          const drag = 1 - dt * (p.drag ?? 1.5);
          p.vx *= drag; p.vy = p.vy * drag + (p.grav ?? 520) * dt;   // 공기 저항 + 중력
        }
        p.life -= dt / p.dur;
      }
      particles = particles.filter(p => p.life > 0);
    }

    // 화면 밖으로 나간 불똥이: 나간 자리(화면 가장자리)에서 불이 치익 꺼지고 연기가 피어오름
    function extinguish(s) {
      s.gone = true;
      if (reduceMotion) return;   // '동작 줄이기'면 조용히 사라짐
      const ex = Math.min(innerWidth - 8, Math.max(8, s.x));
      const ey = Math.min(innerHeight - 8, Math.max(8, s.y - s.h / 2));
      // 화면 안쪽 방향 (연기가 가장자리에서 안으로 살짝 밀려 들어오게)
      const ix = s.x < 0 ? 1 : s.x > innerWidth ? -1 : 0;
      const iy = s.y - s.h / 2 < 0 ? 1 : s.y - s.h / 2 > innerHeight ? -1 : 0;
      burst(ex, ey, ix, iy, s.w, s.palette);
    }

    // 연기 피우기: (ix, iy) 쪽으로 살짝 밀려나며 위로 피어오름
    function smoke(x, y, w, ix, iy, count) {
      if (reduceMotion) return;
      for (let i = 0; i < count && particles.length < PARTICLE_MAX; i++) {
        particles.push({
          kind: 'smoke',
          x: x + (Math.random() - 0.5) * w * 0.3, y: y + (Math.random() - 0.5) * w * 0.3,
          vx: ix * (25 + Math.random() * 35) + (Math.random() - 0.5) * 20,
          vy: iy * (25 + Math.random() * 35) - (30 + Math.random() * 40),   // 위로 피어오름
          r0: w * (0.12 + Math.random() * 0.1), grow: w * (0.5 + Math.random() * 0.4),
          life: 1, dur: 1.4 + Math.random() * 0.9, delay: i * 0.04
        });
      }
    }

    // 연기: 회색 반투명 덩어리가 커지며 위로 흩어짐 (테두리 없이 부드럽게)
    function drawSmoke() {
      for (const p of particles) {
        if (p.kind !== 'smoke' || p.delay > 0) continue;
        const t = 1 - p.life, e = 1 - Math.pow(1 - t, 2);
        const r = p.r0 + p.grow * e;
        ctx.globalAlpha = SMOKE_ALPHA * Math.min(1, t * 6) * p.life;   // 빠르게 짙어졌다 천천히 옅어짐
        ctx.drawImage(SMOKE_SPRITE, p.x - r, p.y - r, r * 2, r * 2);
      }
      ctx.globalAlpha = 1;
    }

    // 불 온도 색: 막 튀었을 땐 하양-노랑, 식을수록 주황 → 빨강(#FE3636)
    function fireColor(t, a) {
      const r = 255, g = Math.round(54 + 186 * Math.pow(t, 1.4)), b = Math.round(54 + 140 * Math.pow(t, 3));
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    // 바닥 층: 먼지
    function drawPuffs() {
      for (const p of particles) {
        if (p.kind !== 'puff') continue;
        const t = 1 - p.life, e = 1 - Math.pow(1 - t, 3);
        softEllipse(p.x, p.y, p.w * (0.3 + 0.35 * e), p.w * (0.05 + 0.04 * e), 0.18 * p.life);
      }
    }

    // 위 층: 불티·불꽃 (은은하게 빛나며 겹치면 밝아짐)
    function drawEmbers() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (const p of particles) {
        if (p.kind === 'puff' || p.kind === 'smoke') continue;
        if (p.kind === 'bloom') {
          // 터지는 빛: 그 자리에서 빠르게 커지며 옅어짐 (화면 전체가 번쩍이지 않게 그 자리만)
          const e = 1 - Math.pow(p.life, 2), r = p.r * (0.35 + 0.65 * e), a = Math.pow(p.life, 1.5) * 0.85;
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
          // 불똥이 색이 있으면 그 색으로 빛남 (가운데는 하얗게)
          const [cr, cg, cb] = p.col || [254, 54, 54];
          const [mr, mg, mb] = p.col || [255, 150, 70];
          g.addColorStop(0, `rgba(255, 240, 220, ${a})`);
          g.addColorStop(0.25, `rgba(${mr}, ${mg}, ${mb}, ${a * 0.7})`);
          g.addColorStop(0.6, `rgba(${cr}, ${cg}, ${cb}, ${a * 0.3})`);
          g.addColorStop(1, `rgba(${cr}, ${cg}, ${cb}, 0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
          continue;
        }
        if (p.delay > 0) continue;
        const t = p.life, a = Math.min(1, t * 1.6) * (p.kind === 'ember' ? 0.9 : 1);
        // 불티는 꺼지기 직전 살짝 깜빡임
        //  폭죽 불꽃은 끝무렵 반짝반짝
        const flick = p.kind === 'ember' && t < 0.35 ? 0.6 + 0.4 * Math.sin(p.wob * 3)
          : p.col && p.kind === 'spark' && t < 0.4 ? 0.45 + 0.55 * Math.abs(Math.sin(p.life * 60 + p.x)) : 1;
        // 은은한 빛 (미리 그려둔 빛 그림을 깔아줌 — 예전 그림자 흐림과 같은 느낌)
        const halo = (p.kind === 'spark' ? 9 + (p.lw || 1.6) * 2 : 9 + p.r * 2) * (p.col ? 1.6 : 1);
        ctx.globalAlpha = a * 0.8 * flick;
        ctx.drawImage(p.col ? colorGlowSprite(p.col) : glowSprite(t), p.x - halo, p.y - halo, halo * 2, halo * 2);
        ctx.globalAlpha = 1;
        // 색 있는 폭죽은 빛을 더하지 않고 그대로 칠함 (겹쳐도 하얗게 날아가지 않고 제 색이 보임)
        ctx.globalCompositeOperation = p.col ? 'source-over' : 'lighter';
        if (p.glyph) {
          // 하트·별 불꽃: 작은 모양이 살랑 돌며 날아가다 작아지며 꺼짐 (별은 더 많이 돎)
          const sz = (4 + p.lw * 2.2) * (0.55 + 0.45 * t);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot + (1 - t) * p.vr * (p.glyph === 'star' ? 1 : 0.3));
          ctx.globalAlpha = a * flick;
          ctx.drawImage(glyphSprite(p.glyph, p.col || [255, 160, 80]), -sz, -sz, sz * 2, sz * 2);
          ctx.restore();
          ctx.globalCompositeOperation = 'lighter';
        } else if (p.kind === 'spark') {
          // 움직이는 방향으로 빛줄기 (폭죽은 더 길게)
          const tr = p.trail || 0.035;
          ctx.strokeStyle = particleColor(p, t, a * flick);
          ctx.lineWidth = p.lw || 1.6;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * tr, p.y - p.vy * tr);
          ctx.stroke();
          ctx.globalCompositeOperation = 'lighter';
        } else {
          ctx.fillStyle = particleColor(p, t, a * flick);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (0.5 + 0.5 * t), 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = 'lighter';
        }
      }
      ctx.restore();
    }

    // ---------- 화면 ----------

    // 레티나(2배)에서 캔버스를 2배로 그리면 매 프레임 1,000만 픽셀 이상 → 카메라가 1080p라 그만큼 필요 없어서 상한을 둠
    function stageDpr() { return Math.min(window.devicePixelRatio || 1, STAGE_MAX_DPR); }
    function resize() {
      const dpr = stageDpr();
      stage.width = Math.round(innerWidth * dpr);
      stage.height = Math.round(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // 영상을 화면 가득 채우는(cover) 배치
    function videoLayout() {
      const vw = video.videoWidth, vh = video.videoHeight;
      const s = Math.max(innerWidth / vw, innerHeight / vh);
      return { s, ox: (innerWidth - vw * s) / 2, oy: (innerHeight - vh * s) / 2 };
    }

    // ---------- 인식 → 캡처 ----------

    let capturedAt = -1e9;   // 마지막으로 찍힌 시각 (윤곽선이 강조색으로 완성되는 연출용)
    function capture() {
      capturedAt = performance.now();
